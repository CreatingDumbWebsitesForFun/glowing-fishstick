<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#060812"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<title>
    DAMAGE PROGRAM™ — Ultimate Control Center
</title>

<style>

/* ============================================================
   DAMAGE PROGRAM™
   ULTIMATE EDITION
   FACTORY RESET
   PART 1 — FOUNDATION
   ============================================================ */


/* ============================================================
   001 — ROOT VARIABLES
   ============================================================ */

:root {

    --bg-0:
        #05060c;

    --bg-1:
        #080b14;

    --bg-2:
        #0d1220;

    --bg-3:
        #12192a;

    --panel:
        rgba(17, 23, 39, 0.82);

    --panel-solid:
        #111727;

    --panel-hover:
        rgba(255, 255, 255, 0.065);

    --panel-active:
        rgba(255, 255, 255, 0.095);

    --border:
        rgba(255, 255, 255, 0.09);

    --border-strong:
        rgba(255, 255, 255, 0.18);

    --text:
        #f5f7ff;

    --text-soft:
        #c6cee2;

    --muted:
        #8995b0;

    --cyan:
        #54ddff;

    --cyan-soft:
        #2aa8d0;

    --blue:
        #4389ff;

    --purple:
        #a66cff;

    --purple-dark:
        #6538bd;

    --pink:
        #ff5fd5;

    --pink-dark:
        #c932a2;

    --red:
        #ff405b;

    --red-dark:
        #8e172b;

    --orange:
        #ff9c42;

    --yellow:
        #ffd65a;

    --green:
        #50e49a;

    --water:
        #2698ff;

    --water-dark:
        #064da9;

    --ice:
        #dff7ff;

    --shadow-small:
        0 8px 24px rgba(0,0,0,0.25);

    --shadow:
        0 20px 60px rgba(0,0,0,0.36);

    --shadow-large:
        0 35px 100px rgba(0,0,0,0.48);

    --radius-small:
        12px;

    --radius:
        20px;

    --radius-large:
        28px;

    --transition-fast:
        120ms ease;

    --transition:
        180ms ease;

    --transition-slow:
        320ms ease;

}


/* ============================================================
   002 — RESET
   ============================================================ */

* {

    box-sizing:
        border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html {

    width:
        100%;

    min-height:
        100%;

    margin:
        0;

    padding:
        0;

    background:
        var(--bg-0);

    scroll-behavior:
        smooth;

}


body {

    width:
        100%;

    min-height:
        100vh;

    margin:
        0;

    padding:
        0;

    color:
        var(--text);

    background:
        var(--bg-1);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    overflow-x:
        hidden;

}


button,
input,
select,
textarea {

    font:
        inherit;

}


button {

    border:
        0;

}


button,
[role="button"] {

    -webkit-user-select:
        none;

    user-select:
        none;

}


button:focus-visible,
input:focus-visible,
select:focus-visible {

    outline:
        2px solid var(--cyan);

    outline-offset:
        3px;

}


/* ============================================================
   003 — BACKGROUND
   ============================================================ */

body::before {

    content:
        "";

    position:
        fixed;

    inset:
        0;

    z-index:
        -20;

    pointer-events:
        none;

    background:

        radial-gradient(
            circle at 8% 5%,
            rgba(84,221,255,0.12),
            transparent 29%
        ),

        radial-gradient(
            circle at 91% 10%,
            rgba(255,95,213,0.10),
            transparent 30%
        ),

        radial-gradient(
            circle at 48% 105%,
            rgba(166,108,255,0.11),
            transparent 42%
        );

}


body::after {

    content:
        "";

    position:
        fixed;

    inset:
        0;

    z-index:
        -19;

    pointer-events:
        none;

    opacity:
        0.08;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.045) 1px,
            transparent 1px
        );

    background-size:
        100% 5px;

}


/* ============================================================
   004 — APP SHELL
   ============================================================ */

#app {

    width:
        min(1280px, 100%);

    min-height:
        100vh;

    margin:
        0 auto;

    padding:
        18px;

}


@media (
    max-width: 700px
) {

    #app {

        padding:
            10px;

    }

}


/* ============================================================
   005 — GLASS
   ============================================================ */

.glass {

    background:
        var(--panel);

    border:
        1px solid var(--border);

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(20px)
        saturate(130%);

    -webkit-backdrop-filter:
        blur(20px)
        saturate(130%);

}


/* ============================================================
   006 — TOP BAR
   ============================================================ */

.topbar {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        20px;

    padding:
        18px;

    border-radius:
        var(--radius-large);

}


.brand {

    display:
        flex;

    align-items:
        center;

    min-width:
        0;

    gap:
        14px;

}


.logo {

    width:
        56px;

    height:
        56px;

    flex:
        0 0 auto;

    display:
        grid;

    place-items:
        center;

    border:
        1px solid rgba(255,255,255,0.12);

    border-radius:
        18px;

    background:

        linear-gradient(
            145deg,
            #17253f,
            #21142f
        );

    box-shadow:

        inset 0 0 28px
        rgba(84,221,255,0.08),

        0 0 30px
        rgba(84,221,255,0.05);

    font-size:
        29px;

}


.brand-copy {

    min-width:
        0;

}


.title-main {

    margin:
        0;

    color:
        var(--text);

    font-size:
        clamp(23px, 5vw, 38px);

    font-weight:
        950;

    line-height:
        1;

    letter-spacing:
        -0.055em;

}


.title-sub {

    margin-top:
        7px;

    color:
        var(--muted);

    font-size:
        10px;

    font-weight:
        800;

    letter-spacing:
        0.17em;

}


.system-status {

    display:
        flex;

    align-items:
        center;

    flex:
        0 0 auto;

    gap:
        8px;

    color:
        var(--muted);

    font-size:
        11px;

    font-weight:
        800;

    white-space:
        nowrap;

}


.system-dot {

    width:
        9px;

    height:
        9px;

    border-radius:
        50%;

    background:
        var(--green);

    box-shadow:
        0 0 16px
        rgba(80,228,154,0.9);

}


/* ============================================================
   007 — MAIN GRID
   ============================================================ */

.main-grid {

    display:
        grid;

    grid-template-columns:
        minmax(0, 1.2fr)
        minmax(300px, 0.8fr);

    align-items:
        start;

    gap:
        16px;

    margin-top:
        16px;

}


@media (
    max-width: 900px
) {

    .main-grid {

        grid-template-columns:
            1fr;

    }

    .system-status {

        display:
            none;

    }

}


/* ============================================================
   008 — CARD
   ============================================================ */

.card {

    padding:
        18px;

    border-radius:
        var(--radius);

}


.card + .card {

    margin-top:
        16px;

}


/* ============================================================
   009 — SCORE CARD
   ============================================================ */

.score-card {

    position:
        relative;

    overflow:
        hidden;

    padding:
        28px 18px;

    text-align:
        center;

}


.score-card::before {

    content:
        "";

    position:
        absolute;

    left:
        50%;

    top:
        -100px;

    width:
        360px;

    height:
        220px;

    transform:
        translateX(-50%);

    border-radius:
        50%;

    background:
        radial-gradient(
            ellipse,
            rgba(84,221,255,0.10),
            transparent 70%
        );

    pointer-events:
        none;

}


.score-label {

    position:
        relative;

    color:
        var(--muted);

    font-size:
        10px;

    font-weight:
        900;

    letter-spacing:
        0.22em;

}


.score-number {

    position:
        relative;

    margin:
        10px 0;

    font-size:
        clamp(58px, 13vw, 110px);

    font-weight:
        950;

    line-height:
        0.92;

    letter-spacing:
        -0.075em;

    background:

        linear-gradient(
            90deg,
            var(--cyan),
            var(--pink),
            var(--purple)
        );

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color:
        transparent;

}


.score-meta {

    position:
        relative;

    display:
        flex;

    justify-content:
        center;

    flex-wrap:
        wrap;

    gap:
        8px;

}


.pill {

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    min-height:
        30px;

    padding:
        6px 11px;

    border:
        1px solid var(--border);

    border-radius:
        999px;

    color:
        var(--muted);

    background:
        rgba(255,255,255,0.025);

    font-size:
        10px;

    font-weight:
        800;

}


/* ============================================================
   010 — SECTION TITLE
   ============================================================ */

.section-title {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

    margin:
        2px 2px 12px;

}


.section-title h2 {

    margin:
        0;

    font-size:
        16px;

    font-weight:
        900;

    letter-spacing:
        -0.025em;

}


.section-title span {

    color:
        var(--muted);

    font-size:
        10px;

    font-weight:
        700;

}


/* ============================================================
   011 — CATEGORY LIST
   ============================================================ */

.categories {

    display:
        grid;

    gap:
        10px;

}


.category {

    overflow:
        hidden;

    border:
        1px solid var(--border);

    border-radius:
        18px;

    background:
        rgba(5,8,17,0.52);

    transition:
        border-color var(--transition),
        background var(--transition);

}


.category.open {

    border-color:
        var(--border-strong);

    background:
        rgba(8,12,24,0.72);

}


/* ============================================================
   012 — CATEGORY HEADER
   ============================================================ */

.category-header {

    width:
        100%;

    min-height:
        70px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        12px;

    padding:
        14px;

    color:
        var(--text);

    background:
        transparent;

    text-align:
        left;

    cursor:
        pointer;

    touch-action:
        manipulation;

}


.category-header:active {

    background:
        rgba(255,255,255,0.04);

}


.category-left {

    display:
        flex;

    align-items:
        center;

    min-width:
        0;

    gap:
        12px;

}


.category-icon {

    width:
        40px;

    height:
        40px;

    flex:
        0 0 auto;

    display:
        grid;

    place-items:
        center;

    border:
        1px solid rgba(255,255,255,0.06);

    border-radius:
        13px;

    background:
        rgba(255,255,255,0.045);

    font-size:
        23px;

}


.category-copy {

    min-width:
        0;

}


.category-name {

    display:
        block;

    overflow:
        hidden;

    color:
        var(--text);

    font-size:
        14px;

    font-weight:
        900;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;

}


.category-description {

    display:
        block;

    margin-top:
        3px;

    overflow:
        hidden;

    color:
        var(--muted);

    font-size:
        10px;

    line-height:
        1.3;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;

}


.category-arrow {

    flex:
        0 0 auto;

    color:
        var(--muted);

    font-size:
        20px;

    transition:
        transform var(--transition);

}


.category.open .category-arrow {

    transform:
        rotate(180deg);

}


/* ============================================================
   013 — EVENT GRID
   ============================================================ */

.event-grid {

    display:
        grid;

    grid-template-rows:
        0fr;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap:
        9px;

    padding:
        0 10px;

    overflow:
        hidden;

    transition:
        grid-template-rows 240ms ease,
        padding-bottom 240ms ease;

}


.category.open .event-grid {

    grid-template-rows:
        1fr;

    padding-bottom:
        10px;

}


.event-grid-inner {

    min-height:
        0;

}


/* ============================================================
   014 — EVENT BUTTON
   ============================================================ */

.event-button {

    position:
        relative;

    width:
        100%;

    min-height:
        84px;

    padding:
        13px;

    overflow:
        hidden;

    border:
        1px solid var(--border);

    border-radius:
        15px;

    color:
        var(--text);

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,0.06),
            rgba(255,255,255,0.018)
        );

    text-align:
        left;

    cursor:
        pointer;

    transition:
        transform var(--transition-fast),
        border-color var(--transition),
        background var(--transition);

    touch-action:
        manipulation;

}


.event-button::before {

    content:
        "";

    position:
        absolute;

    inset:
        0;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(84,221,255,0.07),
            transparent 45%
        );

    pointer-events:
        none;

}


.event-button::after {

    content:
        "";

    position:
        absolute;

    top:
        0;

    bottom:
        0;

    left:
        -120%;

    width:
        70%;

    transform:
        skewX(-20deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.09),
            transparent
        );

    transition:
        left 500ms ease;

    pointer-events:
        none;

}


.event-button:hover {

    border-color:
        var(--border-strong);

    background:
        var(--panel-hover);

    transform:
        translateY(-2px);

}


.event-button:hover::after {

    left:
        145%;

}


.event-button:active {

    transform:
        scale(0.975);

}


.event-code {

    position:
        relative;

    display:
        block;

    color:
        var(--text);

    font-size:
        14px;

    font-weight:
        950;

}


.event-description {

    position:
        relative;

    display:
        block;

    margin-top:
        5px;

    color:
        var(--muted);

    font-size:
        10px;

    line-height:
        1.35;

}


.event-points {

    position:
        relative;

    display:
        inline-block;

    margin-top:
        7px;

    color:
        var(--yellow);

    font-size:
        10px;

    font-weight:
        900;

}


.event-button[data-danger="true"] {

    border-color:
        rgba(255,64,91,0.16);

}


.event-button[data-danger="true"]
.event-points {

    color:
        #ff8192;

}


@media (
    max-width: 540px
) {

    .event-grid {

        grid-template-columns:
            1fr;

    }

}


/* ============================================================
   015 — HISTORY
   ============================================================ */

.history {

    max-height:
        460px;

    overflow-y:
        auto;

    overscroll-behavior:
        contain;

    scrollbar-width:
        thin;

}


.history::-webkit-scrollbar {

    width:
        6px;

}


.history::-webkit-scrollbar-thumb {

    border-radius:
        999px;

    background:
        rgba(255,255,255,0.12);

}


.history-empty {

    padding:
        42px 10px;

    color:
        var(--muted);

    text-align:
        center;

    font-size:
        12px;

}


.history-row {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        12px;

    margin-bottom:
        7px;

    padding:
        11px 12px;

    border:
        1px solid rgba(255,255,255,0.055);

    border-radius:
        13px;

    background:
        rgba(255,255,255,0.032);

    font-size:
        11px;

}


.history-main {

    min-width:
        0;

}


.history-code {

    font-weight:
        950;

}


.history-name {

    color:
        var(--muted);

}


.history-points {

    flex:
        0 0 auto;

    color:
        var(--yellow);

    font-weight:
        950;

}


/* ============================================================
   016 — CONTROLS
   ============================================================ */

.control-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap:
        9px;

}


.control-button {

    min-height:
        50px;

    padding:
        10px;

    border:
        1px solid var(--border);

    border-radius:
        14px;

    color:
        var(--text);

    background:
        #151b2c;

    cursor:
        pointer;

    transition:
        transform var(--transition-fast),
        border-color var(--transition),
        background var(--transition);

    touch-action:
        manipulation;

}


.control-button:hover {

    border-color:
        var(--border-strong);

    background:
        #1a2237;

}


.control-button:active {

    transform:
        scale(0.97);

}


.control-restore {

    border-color:
        rgba(80,228,154,0.22);

    background:
        rgba(16,43,34,0.95);

}


.control-danger {

    border-color:
        rgba(255,64,91,0.24);

    background:
        rgba(53,18,29,0.95);

}


/* ============================================================
   017 — EFFECT LAYER
   ============================================================ */

#effect-layer {

    position:
        fixed;

    inset:
        0;

    z-index:
        10000;

    overflow:
        hidden;

    pointer-events:
        none;

}


/* ============================================================
   018 — TOAST
   ============================================================ */

#toast {

    position:
        fixed;

    left:
        50%;

    bottom:
        max(20px, env(safe-area-inset-bottom));

    z-index:
        50000;

    width:
        max-content;

    max-width:
        calc(100vw - 30px);

    padding:
        12px 17px;

    border:
        1px solid var(--border-strong);

    border-radius:
        14px;

    background:
        rgba(10,14,25,0.96);

    box-shadow:
        var(--shadow);

    color:
        var(--text);

    font-size:
        12px;

    font-weight:
        900;

    text-align:
        center;

    opacity:
        0;

    transform:
        translate(-50%, 20px);

    transition:
        opacity 180ms ease,
        transform 180ms ease;

    pointer-events:
        none;

}


#toast.visible {

    opacity:
        1;

    transform:
        translate(-50%, 0);

}


/* ============================================================
   019 — CRITICAL ALERT BASE
   ============================================================ */

.critical-alert {

    position:
        fixed;

    left:
        50%;

    top:
        clamp(70px, 13vh, 150px);

    z-index:
        30000;

    width:
        min(900px, calc(100vw - 32px));

    padding:
        14px;

    transform:
        translateX(-50%);

    text-align:
        center;

    pointer-events:
        none;

    animation:
        critical-alert-life
        2800ms
        ease
        forwards;

}


.critical-alert-title {

    display:
        block;

    overflow-wrap:
        anywhere;

    color:
        var(--red);

    font-size:
        clamp(24px, 7vw, 55px);

    font-weight:
        1000;

    line-height:
        1.05;

    letter-spacing:
        0.015em;

    text-shadow:
        0 0 8px rgba(255,64,91,0.9),
        0 0 28px rgba(255,64,91,0.55);

}


.critical-alert-sub {

    display:
        block;

    max-width:
        100%;

    margin-top:
        8px;

    color:
        #ffacb8;

    font-size:
        clamp(9px, 2.5vw, 13px);

    font-weight:
        850;

    line-height:
        1.4;

    letter-spacing:
        0.11em;

    overflow-wrap:
        anywhere;

}


@keyframes critical-alert-life {

    0% {

        opacity:
            0;

        transform:
            translate(-50%, -18px)
            scale(0.92);

    }

    12% {

        opacity:
            1;

        transform:
            translate(-50%, 0)
            scale(1);

    }

    76% {

        opacity:
            1;

        transform:
            translate(-50%, 0)
            scale(1);

    }

    100% {

        opacity:
            0;

        transform:
            translate(-50%, -8px)
            scale(1.03);

    }

}


/* ============================================================
   020 — PINK PURPLE ALERT
   ============================================================ */

.pink-purple-alert
.critical-alert-title {

    background:

        linear-gradient(
            90deg,
            #ff63d5,
            #ff8de2,
            #a66cff,
            #7355ff,
            #ff63d5
        );

    background-size:
        250% auto;

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color:
        transparent;

    animation:
        pink-purple-flow
        1800ms
        linear
        infinite;

}


.pink-purple-alert
.critical-alert-sub {

    color:

const APP = {

const STATE = {

    score:

    events:

    powerOut:
        false,

    history:
        [],

    achievements:
        [],

    settings: {

        effects:
            true,

        particles:
            true,

        shake:
            true,

        sounds:
            false

    },

    sessionStarted:

};


/* ============================================================
   029 — RUNTIME
   ============================================================ */

const RUNTIME = {

    toastTimer:
        null,

    effectCount:
        0,

    lastRender:
        0,

    initialized:
        false

};


/* ============================================================
   030 — UTILITY: RANDOM
   ============================================================ */

function random(
    minimum,
    maximum
) {

    return (
        Math.random() *
        (
            maximum -
            minimum
        )
    ) +
    minimum;

}


/* ============================================================
   031 — UTILITY: RANDOM INTEGER
   ============================================================ */

function randomInt(
    minimum,
    maximum
) {

    return Math.floor(
        random(
            minimum,
            maximum + 1
        )
    );

}


/* ============================================================
   032 — UTILITY: CLAMP
   ============================================================ */

function clamp(
    value,
    minimum,
    maximum
) {

    return Math.min(
        maximum,
        Math.max(
            minimum,
            value
        )
    );

}


/* ============================================================
   033 — UTILITY: ESCAPE HTML
   ============================================================ */

function escapeHTML(
    value
) {

    return String(
        value
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ============================================================
   034 — UTILITY: TIME
   ============================================================ */

function formatTime(
    date
) {

    const value =
        date instanceof Date
            ? date
            : new Date(date);

    return value.toLocaleTimeString(
        [],
        {
            hour:
                "numeric",

            minute:
                "2-digit",

            second:
                "2-digit"
        }
    );

}


/* ============================================================
   035 — STORAGE LOAD
   ============================================================ */

function loadState() {

    try {

        const raw =
            localStorage.getItem(
                APP.storageKey
            );


        if (!raw) {

            return;

        }


        const saved =
            JSON.parse(
                raw
            );


        if (
            typeof saved.score ===
            "number"
        ) {

            STATE.score =
                saved.score;

        }


        if (
            typeof saved.events ===
            "number"
        ) {

            STATE.events =
                saved.events;

        }


        if (
            typeof saved.powerOut ===
            "boolean"
        ) {

            STATE.powerOut =
                saved.powerOut;

        }


        if (
            Array.isArray(
                saved.history
            )
        ) {

            STATE.history =
                saved.history.slice(
                    0,
                    APP.maxHistory
                );

        }


        if (
            Array.isArray(
                saved.achievements
            )
        ) {

            STATE.achievements =
                saved.achievements;

        }


        if (
            saved.settings &&
            typeof saved.settings ===
            "object"
        ) {

            STATE.settings = {

                ...STATE.settings,

                ...saved.settings

            };

        }

    }

    catch (
        error
    ) {

        console.warn(
            "Could not load saved state.",
            error
        );

    }

}


/* ============================================================
   036 — STORAGE SAVE
   ============================================================ */

function saveState() {

    try {

        localStorage.setItem(
            APP.storageKey,

            JSON.stringify({

                score:
                    STATE.score,

                events:
                    STATE.events,

                powerOut:
                    STATE.powerOut,

                history:
                    STATE.history,

                achievements:
                    STATE.achievements,

                settings:
                    STATE.settings

            })

        );

    }

    catch (
        error
    ) {

        console.warn(
            "Could not save state.",
            error
        );

    }

}


/* ============================================================
   037 — UPDATE SCORE
   ============================================================ */

function updateScoreDisplay() {

    DOM.score.textContent =
        STATE.score.toLocaleString();

}


/* ============================================================
   038 — UPDATE EVENT COUNT
   ============================================================ */

function updateEventCountDisplay() {

    DOM.eventCount.textContent =
        `${STATE.events} events`;

}


/* ============================================================
   039 — UPDATE ACHIEVEMENT COUNT
   ============================================================ */

function updateAchievementDisplay() {

    const completed =
        STATE.achievements.length;


    DOM.achievementPill.textContent =
        `${completed} / ${APP.achievementMaximum}`;

}


/* ============================================================
   040 — UPDATE HISTORY COUNT
   ============================================================ */

function updateHistoryCountDisplay() {

    DOM.historyCount.textContent =
        STATE.history.length;

}


/* ============================================================
   041 — UPDATE POWER STATUS
   ============================================================ */

function updatePowerDisplay() {

    if (
        STATE.powerOut
    ) {

        DOM.systemDot.style.background =
            "var(--red)";

        DOM.systemDot.style.boxShadow =
            "0 0 16px rgba(255,64,91,0.9)";

        DOM.systemStatusText.textContent =
            "POWER OFFLINE";

    }

    else {

        DOM.systemDot.style.background =
            "var(--green)";

        DOM.systemDot.style.boxShadow =
            "0 0 16px rgba(80,228,154,0.9)";

        DOM.systemStatusText.textContent =
            "SYSTEM ONLINE";

    }

}


/* ============================================================
   042 — UPDATE INTERFACE
   ============================================================ */

function updateInterface() {

    updateScoreDisplay();

    updateEventCountDisplay();

    updateAchievementDisplay();

    updateHistoryCountDisplay();

    updatePowerDisplay();

}


/* ============================================================
   043 — TOAST
   ============================================================ */

function showToast(
    message
) {

    DOM.toast.textContent =
        message;

    DOM.toast.classList.add(
        "visible"
    );


    clearTimeout(
        RUNTIME.toastTimer
    );


    RUNTIME.toastTimer =
        setTimeout(
            () => {

                DOM.toast.classList.remove(
                    "visible"
                );

            },
            2300
        );

}


/* ============================================================
   044 — EFFECT REGISTRATION
   ============================================================ */

function registerEffect(
    element
) {

    RUNTIME.effectCount +=
        1;


    if (
        RUNTIME.effectCount >
        APP.maxEffects
    ) {

        const first =
            DOM.effectLayer.firstElementChild;


        if (first) {

            first.remove();

        }


        RUNTIME.effectCount =
            Math.max(
                0,
                RUNTIME.effectCount - 1
            );

    }


    element.addEventListener(
        "animationend",
        () => {

            RUNTIME.effectCount =
                Math.max(
                    0,
                    RUNTIME.effectCount - 1
                );

        },
        {
            once:
                true
        }
    );


    element.addEventListener(
        "transitionend",
        () => {

            RUNTIME.effectCount =
                Math.max(
                    0,
                    RUNTIME.effectCount - 1
                );

        },
        {
            once:
                true
        }
    );

}


/* ============================================================
   045 — EFFECT APPEND
   ============================================================ */

function appendEffect(
    element
) {

    if (
        !STATE.settings.effects
    ) {

        return null;

    }


    registerEffect(
        element
    );


    DOM.effectLayer.appendChild(
        element
    );


    return element;

}


/* ============================================================
   046 — CLEAR EFFECTS
   ============================================================ */

function clearEffects() {

    DOM.effectLayer.innerHTML =
        "";

    RUNTIME.effectCount =
        0;

}


/* ============================================================
   047 — SHAKE
   ============================================================ */

function screenShake(
    duration = 700
) {

    if (
        !STATE.settings.shake
    ) {

        return;

    }


    document.body.classList.remove(
        "critical-pulse"
    );


    void document.body.offsetWidth;


    document.body.classList.add(
        "critical-pulse"
    );


    setTimeout(
        () => {

            document.body.classList.remove(
                "critical-pulse"
            );

        },
        duration
    );

}


/* ============================================================
   048 — RESET SCORE
   ============================================================ */

function resetScore() {

    STATE.score =
        0;

    updateInterface();

    saveState();

    showToast(
        "🔄 SCORE RESET"
    );

}


/* ============================================================
   049 — CLEAR HISTORY
   ============================================================ */

function clearHistory() {

    STATE.history =
        [];

    STATE.events =
        0;

    STATE.achievements =
        [];

    renderHistory();

    updateInterface();

    saveState();

    showToast(
        "🗑️ HISTORY CLEARED"
    );

}


/* ============================================================
   050 — RESTORE POWER
   ============================================================ */

function restorePower() {

    STATE.powerOut =
        false;

    document.body.classList.remove(
        "power-out"
    );

    updatePowerDisplay();

    saveState();

    showToast(
        "🔌 POWER RESTORED"
    );

}


/* ============================================================
   051 — FULL RESET
   ============================================================ */

function resetEverything() {

    STATE.score =
        0;

    STATE.events =
        0;

    STATE.powerOut =
        false;

    STATE.history =
        [];

    STATE.achievements =
        [];

    clearEffects();

    document.body.classList.remove(
        "power-out",
        "critical-pulse"
    );

    renderHistory();

    updateInterface();

    saveState();

    showToast(
        "💥 DAMAGE PROGRAM RESET"
    );

}


/* ============================================================
   052 — BUTTON EVENTS
   ============================================================ */

DOM.resetScore.addEventListener(
    "click",
    resetScore
);


DOM.clearHistory.addEventListener(
    "click",
    clearHistory
);


DOM.restorePower.addEventListener(
    "click",
    restorePower
);


DOM.resetEverything.addEventListener(
    "click",
    resetEverything
);

function renderCategories() {

    DOM.categories.innerHTML = "";


    EVENT_CATEGORIES.forEach(
        category => {

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "category";


            const header =
                document.createElement("button");

            header.className =
                "category-header";

            header.type =
                "button";


            header.innerHTML = `
                <span class="category-left">

                    <span class="category-icon">
                        ${category.icon}
                    </span>

                    <span class="category-copy">

                        <span class="category-name">
                            ${escapeHTML(category.name)}
                        </span>

                        <span class="category-description">
                            ${escapeHTML(category.description)}
                        </span>

                    </span>

                </span>

                <span class="category-arrow">
                    ▼
                </span>
            `;


            const grid =
                document.createElement("div");

            grid.className =
                "event-grid";


            const inner =
                document.createElement("div");

            inner.className =
                "event-grid-inner";


            category.events.forEach(
                event => {

                    const button =
                        document.createElement("button");

                    button.type =
                        "button";

                    button.className =
                        "event-button";

                    button.dataset.danger =
                        event.danger
                            ? "true"
                            : "false";


                    button.innerHTML = `
                        <span class="event-code">
                            ${escapeHTML(event.name)}
                        </span>

                        <span class="event-description">
                            ${escapeHTML(event.description)}
                        </span>

                        <span class="event-points">
                            +${event.points} POINTS
                        </span>
                    `;


                    button.addEventListener(
                        "click",
                        () => triggerEvent(event)
                    );


                    inner.appendChild(button);

                }
            );


            grid.appendChild(inner);


            header.addEventListener(
                "click",
                () => {

                    wrapper.classList.toggle(
                        "open"
                    );

                }
            );


            wrapper.appendChild(header);
            wrapper.appendChild(grid);

            DOM.categories.appendChild(wrapper);

        }
    );

}


/* ============================================================
   052B — EVENT TRIGGER
   ============================================================ */

function triggerEvent(event) {

    STATE.score +=
        event.points;

    STATE.events +=
        1;


    STATE.history.unshift({

        code:
            event.code,

        name:
            event.name,

        points:
            event.points,

        time:
            Date.now()

    });


    STATE.history =
        STATE.history.slice(
            0,
            APP.maxHistory
        );


    renderHistory();

    updateInterface();

    saveState();


    showToast(
        `${event.name}  +${event.points}`
    );


    if (
        event.danger
    ) {

        screenShake();

    }

}


/* ============================================================
   052C — HISTORY RENDERER
   ============================================================ */

function renderHistory() {

    if (
        !DOM.history
    ) {

        return;

    }


    if (
        STATE.history.length === 0
    ) {

        DOM.history.innerHTML = `
            <div class="history-empty">
                No events yet.
            </div>
        `;

        return;

    }


    DOM.history.innerHTML =
        STATE.history
            .map(
                item => `
                    <div class="history-row">

                        <div class="history-main">

                            <div class="history-code">
                                ${escapeHTML(item.code)}
                            </div>

                            <div class="history-name">
                                ${escapeHTML(item.name)}
                                · ${formatTime(item.time)}
                            </div>

                        </div>

                        <div class="history-points">
                            +${Number(item.points).toLocaleString()}
                        </div>

                    </div>
                `
            )
            .join("");

}


/* ============================================================
   053 — INITIALIZATION
   ============================================================ */

function initializeApplication() {

    if (
        RUNTIME.initialized
    ) {

        return;

    }


    RUNTIME.initialized =
        true;


    loadState();

    renderHistory();

    updateInterface();


    console.log(
        `${APP.name} ${APP.version}`
    );

    console.log(
        "PART 1 FOUNDATION ONLINE."
    );

/* ============================================================
   057 — FIND EVENT
   ============================================================ */

function findEvent(
    eventID
) {

    return EVENTS.find(
        event =>
            event.id === eventID
    );

}


/* ============================================================
   058 — RENDER CATEGORIES
   ============================================================ */

function renderCategories() {

    DOM.categories.innerHTML =
        "";


    CATEGORIES.forEach(
        category => {

            const wrapper =
                document.createElement(
                    "section"
                );

            wrapper.className =
                "category";


            const header =
                document.createElement(
                    "button"
                );

            header.type =
                "button";

            header.className =
                "category-header";


            header.innerHTML = `

                <span class="category-left">

                    <span class="category-icon">
                        ${category.icon}
                    </span>

                    <span class="category-copy">

                        <span class="category-name">
                            ${escapeHTML(category.name)}
                        </span>

                        <span class="category-description">
                            ${escapeHTML(category.description)}
                        </span>

                    </span>

                </span>

                <span class="category-arrow">
                    ▼
                </span>

            `;


            const grid =
                document.createElement(
                    "div"
                );

            grid.className =
                "event-grid";


            const inner =
                document.createElement(
                    "div"
                );

            inner.className =
                "event-grid-inner";


            const categoryEvents =
                EVENTS.filter(
                    event =>
                        event.category ===
                        category.id
                );


            categoryEvents.forEach(
                event => {

                    const button =
                        createEventButton(
                            event
                        );

                    inner.appendChild(
                        button
                    );

                }
            );


            grid.appendChild(
                inner
            );


            wrapper.appendChild(
                header
            );

            wrapper.appendChild(
                grid
            );


            header.addEventListener(
                "click",
                () => {

                    wrapper.classList.toggle(
                        "open"
                    );

                }
            );


            DOM.categories.appendChild(
                wrapper
            );

        }
    );

}


/* ============================================================
   059 — CREATE EVENT BUTTON
   ============================================================ */

function createEventButton(
    event
) {

    const button =
        document.createElement(
            "button"
        );


    button.type =
        "button";


    button.className =
        "event-button";


    button.dataset.danger =
        event.danger
            ? "true"
            : "false";


    button.innerHTML = `

        <span class="event-code">
            ${event.icon}
            ${escapeHTML(event.code)}
        </span>

        <span class="event-description">
            ${escapeHTML(event.description)}
        </span>

        <span class="event-points">
            +${event.points.toLocaleString()} PTS
        </span>

    `;


    button.addEventListener(
        "click",
        () => {

            triggerEvent(
                event.id
            );

        }
    );


    return button;

}


/* ============================================================
   060 — ADD HISTORY ENTRY
   ============================================================ */

function addHistoryEntry(
    event
) {

    STATE.history.unshift({

        id:
            event.id,

        code:
            event.code,

        name:
            event.name,

        points:
            event.points,

        time:
            new Date().toISOString()

    });


    STATE.history =
        STATE.history.slice(
            0,
            APP.maxHistory
        );


    renderHistory();

}


/* ============================================================
   061 — RENDER HISTORY
   ============================================================ */

function renderHistory() {

    if (
        STATE.history.length ===
        0
    ) {

        DOM.history.innerHTML = `

            <div class="history-empty">
                No events yet.
            </div>

        `;

        return;

    }


    DOM.history.innerHTML =
        STATE.history
            .map(
                item => `

                    <div class="history-row">

                        <div class="history-main">

                            <div class="history-code">
                                ${escapeHTML(item.code)}
                            </div>

                            <div class="history-name">
                                ${escapeHTML(item.name)}
                                ·
                                ${escapeHTML(
                                    formatTime(item.time)
                                )}
                            </div>

                        </div>

                        <div class="history-points">
                            +${Number(
                                item.points
                            ).toLocaleString()}
                        </div>

                    </div>

                `
            )
            .join("");

}


/* ============================================================
   062 — SCORE EVENT
   ============================================================ */

function scoreEvent(
    event
) {

    STATE.score +=
        event.points;

    STATE.events +=
        1;

    addHistoryEntry(
        event
    );


    updateInterface();

    saveState();

}


/* ============================================================
   063 — CRITICAL ALERT
   ============================================================ */

function showCriticalAlert(
    title,
    subtitle,
    pink = false
) {

    const alert =
        document.createElement(
            "div"
        );


    alert.className =
        "critical-alert";


    if (pink) {

        alert.classList.add(
            "pink-purple-alert"
        );

    }


    alert.innerHTML = `

        <span class="critical-alert-title">
            ${escapeHTML(title)}
        </span>

        <span class="critical-alert-sub">
            ${escapeHTML(subtitle)}
        </span>

    `;


    appendEffect(
        alert
    );


    setTimeout(
        () => {

            alert.remove();

        },
        3000
    );

}


/* ============================================================
   064 — TORNADO EFFECT
   ============================================================ */

function createTornadoEffect(
    event
) {

    showCriticalAlert(
        event.name,
        "⚠️ DISASTER EVENT DETECTED",
        false
    );


    screenShake(
        900

    const tornado =
        document.createElement(
            "div"
        );


    tornado.style.position =
        "absolute";

    tornado.style.left =
        "50%";

    tornado.style.top =
        "50%";

    tornado.style.width =
        "180px";

    tornado.style.height =
        "180px";

    tornado.style.borderRadius =
        "50%";

    tornado.style.transform =
        "translate(-50%, -50%)";

    tornado.style.background =
        `radial-gradient(
            circle,
            rgba(255,255,255,0.12),
            rgba(166,108,255,0.08) 30%,
            transparent 70%
        )`;

    tornado.style.boxShadow =
        `
            0 0 40px rgba(166,108,255,0.4),
            0 0 100px rgba(84,221,255,0.18)
        `;

    tornado.style.animation =
        "tornado-spin 900ms linear";


    appendEffect(
        tornado
    );


    for (
        let i = 0;
        i < 28;
        i++
    ) {

        createTornadoParticle();

    }


    setTimeout(
        () => {

            tornado.remove();

        },
        1000
    );

}


/* ============================================================
   065 — TORNADO PARTICLE
   ============================================================ */

function createTornadoParticle() {

    const particle =
        document.createElement(
            "div"
        );


    const size =
        randomInt(
            5,
            15
        );


    particle.style.position =
        "absolute";

    particle.style.left =
        "50%";

    particle.style.top =
        "50%";

    particle.style.width =
        `${size}px`;

    particle.style.height =
        `${size}px`;

    particle.style.borderRadius =
        "50%";

    particle.style.background =
        "rgba(220,230,255,0.75)";

    particle.style.boxShadow =
        "0 0 12px rgba(180,210,255,0.4)";

    particle.style.setProperty(
        "--x",
        `${randomInt(-220,220)}px`
    );

    particle.style.setProperty(
        "--y",
        `${randomInt(-220,220)}px`
    );

    particle.style.animation =
        `tornado-particle ${
            randomInt(600,1100)
        }ms ease-out forwards`;


    appendEffect(
        particle
    );


    setTimeout(
        () => {

            particle.remove();

        },
        1200
    );

}


/* ============================================================
   066 — GENERIC EFFECT
   ============================================================ */

function createGenericEffect(
    event
) {

    showCriticalAlert(
        event.name,
        "DISASTER EVENT ACTIVATED",
        event.category === "chaos"
    );


    if (
        event.danger
    ) {

        screenShake(
            650
        );

    }


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );


        particle.style.position =
            "absolute";

        particle.style.left =
            `${randomInt(10,90)}%`;

        particle.style.top =
            `${randomInt(10,90)}%`;

        particle.style.width =
            `${randomInt(4,12)}px`;

        particle.style.height =
            `${randomInt(4,12)}px`;

        particle.style.borderRadius =
            "50%";

        particle.style.background =
            "rgba(255,255,255,0.65)";

        particle.style.animation =
            `generic-particle ${
                randomInt(500,1000)
            }ms ease-out forwards`;


        appendEffect(
            particle
        );


        setTimeout(
            () => {

                particle.remove();

            },
            1100
        );

    }

}


/* ============================================================
   067 — EVENT EFFECT ROUTER
   ============================================================ */

function runEventEffect(
    event
) {

    switch (
        event.effect
    ) {

        case "tornado":

            createTornadoEffect(
                event
            );

            break;


        default:

            createGenericEffect(
                event
            );

            break;

    }

}


/* ============================================================
   068 — TRIGGER EVENT
   ============================================================ */

function triggerEvent(
    eventID
) {

    const event =
        findEvent(
            eventID
        );


    if (!event) {

        console.warn(
            "Unknown event:",
            eventID
        );

        return;

    }


    scoreEvent(
        event
    );


    runEventEffect(
        event
    );


    showToast(
        `${event.icon} ${event.name} +${event.points} PTS`
    );

}
