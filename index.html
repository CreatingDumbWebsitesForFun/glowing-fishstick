<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#05060c">

<title>DAMAGE PROGRAM™ — Ultimate Control Center</title>

<style>

/* ============================================================
   DAMAGE PROGRAM™
   ULTIMATE EDITION — FACTORY RESET
   PART 1/5 — FOUNDATION
   ============================================================ */


/* ============================================================
   001 — ROOT
   ============================================================ */

:root {

    --bg:
        #05060c;

    --bg2:
        #080b14;

    --panel:
        rgba(16,22,38,0.88);

    --panel-solid:
        #101626;

    --panel-hover:
        rgba(255,255,255,0.07);

    --border:
        rgba(255,255,255,0.10);

    --border-bright:
        rgba(255,255,255,0.20);

    --text:
        #f5f7ff;

    --muted:
        #8995b0;

    --cyan:
        #54ddff;

    --blue:
        #4389ff;

    --purple:
        #a66cff;

    --pink:
        #ff5fd5;

    --red:
        #ff405b;

    --orange:
        #ff9c42;

    --yellow:
        #ffd65a;

    --green:
        #50e49a;

    --water:
        #2698ff;

    --shadow:
        0 20px 60px rgba(0,0,0,0.35);

    --radius:
        20px;

    --radius-small:
        14px;

}


/* ============================================================
   002 — RESET
   ============================================================ */

* {

    box-sizing:
        border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html {

    margin:
        0;

    padding:
        0;

    min-height:
        100%;

    background:
        var(--bg);

}


body {

    margin:
        0;

    padding:
        0;

    min-height:
        100vh;

    overflow-x:
        hidden;

    color:
        var(--text);

    background:
        var(--bg2);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

}


button {

    font:
        inherit;

}


/* ============================================================
   003 — BACKGROUND
   ============================================================ */

body::before {

    content:
        "";

    position:
        fixed;

    inset:
        0;

    z-index:
        -2;

    pointer-events:
        none;

    background:

        radial-gradient(
            circle at 10% 5%,
            rgba(84,221,255,0.13),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 10%,
            rgba(255,95,213,0.10),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(166,108,255,0.12),
            transparent 40%
        );

}


body::after {

    content:
        "";

    position:
        fixed;

    inset:
        0;

    z-index:
        -1;

    pointer-events:
        none;

    opacity:
        0.055;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.08) 1px,
            transparent 1px
        );

    background-size:
        100% 5px;

}


/* ============================================================
   004 — APP
   ============================================================ */

#app {

    width:
        min(1250px, 100%);

    min-height:
        100vh;

    margin:
        0 auto;

    padding:
        18px;

}


@media (max-width: 600px) {

    #app {

        padding:
            10px;

    }

}


/* ============================================================
   005 — GLASS
   ============================================================ */

.glass {

    background:
        var(--panel);

    border:
        1px solid var(--border);

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

}


/* ============================================================
   006 — HEADER
   ============================================================ */

.topbar {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        18px;

    padding:
        18px;

    border-radius:
        26px;

}


.brand {

    display:
        flex;

    align-items:
        center;

    gap:
        14px;

    min-width:
        0;

}


.logo {

    width:
        56px;

    height:
        56px;

    flex:
        0 0 auto;

    display:
        grid;

    place-items:
        center;

    border:
        1px solid var(--border-bright);

    border-radius:
        17px;

    background:
        linear-gradient(
            145deg,
            #17253f,
            #21142f
        );

    font-size:
        28px;

}


.brand-copy {

    min-width:
        0;

}


.title {

    margin:
        0;

    font-size:
        clamp(24px, 5vw, 40px);

    font-weight:
        950;

    line-height:
        1;

    letter-spacing:
        -0.05em;

}


.subtitle {

    margin-top:
        7px;

    color:
        var(--muted);

    font-size:
        9px;

    font-weight:
        900;

    letter-spacing:
        0.18em;

}


.system-status {

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    color:
        var(--muted);

    font-size:
        11px;

    font-weight:
        900;

    white-space:
        nowrap;

}


.system-dot {

    width:
        9px;

    height:
        9px;

    border-radius:
        50%;

    background:
        var(--green);

    box-shadow:
        0 0 16px
        rgba(80,228,154,0.9);

}


@media (max-width: 800px) {

    .system-status {

        display:
            none;

    }

}


@media (max-width: 600px) {

    .logo {

        width:
            47px;

        height:
            47px;

        font-size:
            23px;

    }

    .title {

        font-size:
            23px;

    }

    .subtitle {

        font-size:
            8px;

    }

}


/* ============================================================
   007 — MAIN LAYOUT
   ============================================================ */

.main-grid {

    display:
        grid;

    grid-template-columns:
        minmax(0, 1.2fr)
        minmax(300px, 0.8fr);

    gap:
        16px;

    align-items:
        start;

    margin-top:
        16px;

}


@media (max-width: 900px) {

    .main-grid {

        grid-template-columns:
            1fr;

    }

}


/* ============================================================
   008 — CARD
   ============================================================ */

.card {

    padding:
        18px;

    border-radius:
        var(--radius);

}


.card + .card {

    margin-top:
        16px;

}


/* ============================================================
   009 — SCORE
   ============================================================ */

.score-card {

    position:
        relative;

    overflow:
        hidden;

    padding:
        28px 18px;

    text-align:
        center;

}


.score-card::before {

    content:
        "";

    position:
        absolute;

    left:
        50%;

    top:
        -120px;

    width:
        420px;

    height:
        260px;

    transform:
        translateX(-50%);

    border-radius:
        50%;

    background:
        radial-gradient(
            ellipse,
            rgba(84,221,255,0.12),
            transparent 70%
        );

}


.score-label {

    position:
        relative;

    color:
        var(--muted);

    font-size:
        10px;

    font-weight:
        950;

    letter-spacing:
        0.22em;

}


.score-number {

    position:
        relative;

    margin:
        10px 0;

    font-size:
        clamp(64px, 14vw, 110px);

    font-weight:
        950;

    line-height:
        0.9;

    letter-spacing:
        -0.08em;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--pink),
            var(--purple)
        );

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color:
        transparent;

}


.score-meta {

    position:
        relative;

    display:
        flex;

    justify-content:
        center;

    flex-wrap:
        wrap;

    gap:
        8px;

}


.pill {

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    min-height:
        30px;

    padding:
        6px 11px;

    border:
        1px solid var(--border);

    border-radius:
        999px;

    color:
        var(--muted);

    background:
        rgba(255,255,255,0.025);

    font-size:
        10px;

    font-weight:
        850;

}


/* ============================================================
   010 — SECTION HEADER
   ============================================================ */

.section-title {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

    margin:
        2px 2px 13px;

}


.section-title h2 {

    margin:
        0;

    font-size:
        17px;

    font-weight:
        950;

}


.section-title span {

    color:
        var(--muted);

    font-size:
        10px;

    font-weight:
        750;

}


/* ============================================================
   011 — EVENT CENTER
   ============================================================ */

#categories {

    display:
        grid;

    gap:
        10px;

}


/* ============================================================
   012 — CATEGORY
   ============================================================ */

.category {

    overflow:
        hidden;

    border:
        1px solid var(--border);

    border-radius:
        18px;

    background:
        rgba(5,8,17,0.55);

}


.category.open {

    border-color:
        var(--border-bright);

    background:
        rgba(8,12,24,0.78);

}


/* ============================================================
   013 — CATEGORY BUTTON
   ============================================================ */

.category-header {

    width:
        100%;

    min-height:
        70px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        12px;

    padding:
        14px;

    border:
        0;

    color:
        var(--text);

    background:
        transparent;

    text-align:
        left;

    cursor:
        pointer;

}


.category-left {

    display:
        flex;

    align-items:
        center;

    gap:
        12px;

    min-width:
        0;

}


.category-icon {

    width:
        42px;

    height:
        42px;

    flex:
        0 0 auto;

    display:
        grid;

    place-items:
        center;

    border:
        1px solid rgba(255,255,255,0.07);

    border-radius:
        13px;

    background:
        rgba(255,255,255,0.045);

    font-size:
        23px;

}


.category-copy {

    min-width:
        0;

}


.category-name {

    display:
        block;

    color:
        var(--text);

    font-size:
        14px;

    font-weight:
        950;

}


.category-description {

    display:
        block;

    margin-top:
        4px;

    color:
        var(--muted);

    font-size:
        10px;

}


.category-arrow {

    flex:
        0 0 auto;

    color:
        var(--muted);

    font-size:
        19px;

    transition:
        transform 180ms ease;

}


.category.open .category-arrow {

    transform:
        rotate(180deg);

}


/* ============================================================
   014 — EVENT LIST
   ============================================================ */

.event-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:
        9px;

    padding:
        0 10px 10px;

}


@media (max-width: 540px) {

    .event-grid {

        grid-template-columns:
            1fr;

    }

}


/* ============================================================
   015 — EVENT BUTTON
   ============================================================ */

.event-button {

    width:
        100%;

    min-height:
        86px;

    padding:
        13px;

    border:
        1px solid var(--border);

    border-radius:
        15px;

    color:
        var(--text);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.06),
            rgba(255,255,255,0.018)
        );

    text-align:
        left;

    cursor:
        pointer;

    transition:
        transform 120ms ease,
        border-color 180ms ease,
        background 180ms ease;

}


.event-button:hover {

    border-color:
        var(--border-bright);

    background:
        var(--panel-hover);

    transform:
        translateY(-2px);

}


.event-button:active {

    transform:
        scale(0.975);

}


.event-code {

    display:
        block;

    font-size:
        14px;

    font-weight:
        950;

}


.event-description {

    display:
        block;

    margin-top:
        5px;

    color:
        var(--muted);

    font-size:
        10px;

    line-height:
        1.35;

}


.event-points {

    display:
        inline-block;

    margin-top:
        7px;

    color:
        var(--yellow);

    font-size:
        10px;

    font-weight:
        950;

}


/* ============================================================
   016 — HISTORY
   ============================================================ */

.history {

    max-height:
        500px;

    overflow-y:
        auto;

}


.history-empty {

    padding:
        40px 10px;

    color:
        var(--muted);

    text-align:
        center;

    font-size:
        12px;

}


.history-row {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

    margin-bottom:
        7px;

    padding:
        11px 12px;

    border:
        1px solid rgba(255,255,255,0.055);

    border-radius:
        13px;

    background:
        rgba(255,255,255,0.032);

}


.history-code {

    font-weight:
        950;

}


.history-name {

    color:
        var(--muted);

    font-size:
        10px;

}


.history-points {

    flex:
        0 0 auto;

    color:
        var(--yellow);

    font-weight:
        950;

}


/* ============================================================
   017 — CONTROLS
   ============================================================ */

.control-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:
        9px;

}


.control-button {

    min-height:
        50px;

    padding:
        10px;

    border:
        1px solid var(--border);

    border-radius:
        14px;

    color:
        var(--text);

    background:
        #151b2c;

    cursor:
        pointer;

}


.control-button:active {

    transform:
        scale(0.97);

}


.control-danger {

    border-color:
        rgba(255,64,91,0.25);

    background:
        rgba(53,18,29,0.95);

}


.control-restore {

    border-color:
        rgba(80,228,154,0.23);

    background:
        rgba(16,43,34,0.95);

}


/* ============================================================
   018 — TOAST
   ============================================================ */

#toast {

    position:
        fixed;

    left:
        50%;

    bottom:
        max(20px, env(safe-area-inset-bottom));

    z-index:
        5000;

    max-width:
        calc(100vw - 30px);

    padding:
        12px 17px;

    border:
        1px solid var(--border-bright);

    border-radius:
        14px;

    color:
        var(--text);

    background:
        rgba(10,14,25,0.96);

    box-shadow:
        var(--shadow);

    font-size:
        12px;

    font-weight:
        900;

    text-align:
        center;

    opacity:
        0;

    pointer-events:
        none;

    transform:
        translate(-50%, 20px);

    transition:
        opacity 180ms ease,
        transform 180ms ease;

}


#toast.visible {

    opacity:
        1;

    transform:
        translate(-50%, 0);

}


/* ============================================================
   019 — EFFECT LAYER
   ============================================================ */

#effect-layer {

    position:
        fixed;

    inset:
        0;

    z-index:
        10000;

    pointer-events:
        none;

    overflow:
        hidden;

}


/* ============================================================
   020 — MOBILE
   ============================================================ */

@media (max-width: 600px) {

    .card {

        padding:
            14px;

    }

    .score-card {

        padding:
            25px 14px;

    }

    .control-grid {

        grid-template-columns:
            1fr;

    }

}


/* ============================================================
   END PART 1 CSS
   ============================================================ */

</style>
</head>


<body>


<div id="app">


    <!-- ========================================================
         021 — TOP BAR
         ======================================================== -->

    <header class="topbar glass">

        <div class="brand">

            <div
                class="logo"

                ⚠️

<!-- ============================================================
     026 — EFFECT LAYER
     ============================================================ -->

<div
    id="effect-layer"
    aria-hidden="true"

<!-- ============================================================
     027 — TOAST
     ============================================================ -->

<div
    id="toast"
    role="status"
    aria-live="polite"
></div>


<script>

/* ============================================================
   DAMAGE PROGRAM™
   PART 1/5 — JAVASCRIPT FOUNDATION
   ============================================================ */


/* ============================================================
   028 — DOM
   ============================================================ */

const DOM = {

    app:
        document.getElementById("app"),

    score:
        document.getElementById("score"),

    eventCount:
        document.getElementById("event-count"),

    achievementPill:
        document.getElementById("achievement-pill"),

    categories:
        document.getElementById("categories"),

    history:
        document.getElementById("history"),

    historyCount:
        document.getElementById("history-count"),

    systemDot:
        document.getElementById("system-dot"),

    systemStatusText:
        document.getElementById("system-status-text"),

    effectLayer:
        document.getElementById("effect-layer"),

    toast:
        document.getElementById("toast"),

    resetScore:
        document.getElementById("reset-score"),

    clearHistory:
        document.getElementById("clear-history"),

    restorePower:
        document.getElementById("restore-power"),

    resetEverything:
        document.getElementById("reset-everything")

};


/* ============================================================
   029 — APP CONSTANTS
   ============================================================ */

const APP = {

    name:
        "DAMAGE PROGRAM™",

    version:
        "ULTIMATE EDITION",

    storageKey:
        "damage-program-factory-reset",

    maxHistory:
        250,

    achievementMaximum:
        100

};


/* ============================================================
   030 — STATE
   ============================================================ */

const STATE = {

    score:
        0,

    events:
        0,

    powerOut:
        false,

    history:
        [],

    achievements:
        [],

    settings: {

        effects:
            true,

        particles:
            true,

        shake:
            true,

        sounds:
            false

    }

};


/* ============================================================
   031 — RUNTIME
   ============================================================ */

const RUNTIME = {

    toastTimer:
        null,

    initialized:
        false

};


/* ============================================================
   032 — BASIC HELPERS
   ============================================================ */

function clamp(
    value,
    minimum,
    maximum
) {

    return Math.min(
        maximum,
        Math.max(
            minimum,
            value
        )
    );

}


function escapeHTML(
    value
) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ============================================================
   033 — TOAST
   ============================================================ */

function showToast(
    message
) {

    DOM.toast.textContent =
        message;

    DOM.toast.classList.add(
        "visible"
    );


    clearTimeout(
        RUNTIME.toastTimer
    );


    RUNTIME.toastTimer =
        setTimeout(
            () => {

                DOM.toast.classList.remove(
                    "visible"
                );

            },
            2200
        );

}


/* ============================================================
   034 — STORAGE LOAD
   ============================================================ */

function loadState() {

    try {

        const raw =
            localStorage.getItem(
                APP.storageKey
            );


        if (!raw) {

            return;

        }


        const saved =
            JSON.parse(raw);


        if (
            typeof saved.score ===
            "number"
        ) {

            STATE.score =
                Math.max(
                    0,
                    saved.score
                );

        }


        if (
            typeof saved.events ===
            "number"
        ) {

            STATE.events =
                Math.max(
                    0,
                    saved.events
                );

        }


        if (
            typeof saved.powerOut ===
            "boolean"
        ) {

            STATE.powerOut =
                saved.powerOut;

        }


        if (
            Array.isArray(
                saved.history
            )
        ) {

            STATE.history =
                saved.history.slice(
                    0,
                    APP.maxHistory
                );

        }


        if (
            Array.isArray(
                saved.achievements
            )
        ) {

            STATE.achievements =
                saved.achievements;

        }

    }

    catch (
        error
    ) {

        console.warn(
            "Damage Program state could not be loaded.",
            error
        );

    }

}


/* ============================================================
   035 — STORAGE SAVE
   ============================================================ */

function saveState() {

    try {

        localStorage.setItem(
            APP.storageKey,

            JSON.stringify({

                score:
                    STATE.score,

                events:
                    STATE.events,

                powerOut:
                    STATE.powerOut,

                history:
                    STATE.history,

                achievements:
                    STATE.achievements

            })

        );

    }

    catch (
        error
    ) {

        console.warn(
            "Damage Program state could not be saved.",
            error
        );

    }

}


/* ============================================================
   036 — SCORE DISPLAY
   ============================================================ */

function updateScoreDisplay() {

    DOM.score.textContent =
        STATE.score.toLocaleString();

}


/* ============================================================
   037 — EVENT DISPLAY
   ============================================================ */

function updateEventDisplay() {

    DOM.eventCount.textContent =
        `${STATE.events} events`;

}


/* ============================================================
   038 — HISTORY DISPLAY
   ============================================================ */

function updateHistoryCount() {

    DOM.historyCount.textContent =
        STATE.history.length;

}


/* ============================================================
   039 — ACHIEVEMENT DISPLAY
   ============================================================ */

function updateAchievementDisplay() {

    DOM.achievementPill.textContent =
        `${STATE.achievements.length} / ${APP.achievementMaximum}`;

}


/* ============================================================
   040 — POWER DISPLAY
   ============================================================ */

function updatePowerDisplay() {

    if (STATE.powerOut) {

        DOM.systemDot.style.background =
            "var(--red)";

        DOM.systemDot.style.boxShadow =
            "0 0 16px rgba(255,64,91,0.9)";

        DOM.systemStatusText.textContent =
            "POWER OFFLINE";

    }

    else {

        DOM.systemDot.style.background =
            "var(--green)";

        DOM.systemDot.style.boxShadow =
            "0 0 16px rgba(80,228,154,0.9)";

        DOM.systemStatusText.textContent =
            "SYSTEM ONLINE";

    }

}


/* ============================================================
   041 — INTERFACE UPDATE
   ============================================================ */

function updateInterface() {

    updateScoreDisplay();

    updateEventDisplay();

    updateHistoryCount();

    updateAchievementDisplay();

    updatePowerDisplay();

}


/* ============================================================
   042 — HISTORY RENDERER
   ============================================================ */

function renderHistory() {

    if (
        STATE.history.length ===
        0
    ) {

        DOM.history.innerHTML = `
            <div class="history-empty">
                No events yet.
            </div>
        `;

        return;

    }


    DOM.history.innerHTML =
        STATE.history
            .map(
                item => `
                    <div class="history-row">

                        <div>

                            <div class="history-code">
                                ${escapeHTML(item.code)}
                            </div>

                            <div class="history-name">
                                ${escapeHTML(item.name)}
                            </div>

                        </div>

                        <div class="history-points">
                            +${Number(item.points) || 0}
                        </div>

                    </div>
                `
            )
            .join("");

}


/* ============================================================
   043 — RESET SCORE
   ============================================================ */

function resetScore() {

    STATE.score =
        0;

    updateInterface();

    saveState();

    showToast(
        "🔄 SCORE RESET"
    );

}


/* ============================================================
   044 — CLEAR HISTORY
   ============================================================ */

function clearHistory() {

    STATE.history =
        [];

    STATE.events =
        0;

    STATE.achievements =
        [];

    renderHistory();

    updateInterface();

    saveState();

    showToast(
        "🗑️ HISTORY CLEARED"
    );

}


/* ============================================================
   045 — RESTORE POWER
   ============================================================ */

function restorePower() {

    STATE.powerOut =
        false;

    updatePowerDisplay();

    saveState();

    showToast(
        "🔌 POWER RESTORED"
    );

}


/* ============================================================
   046 — RESET EVERYTHING
   ============================================================ */

function resetEverything() {

    STATE.score =
        0;

    STATE.events =
        0;

    STATE.powerOut =
        false;

    STATE.history =
        [];

    STATE.achievements =
        [];

    renderHistory();

    updateInterface();

    saveState();

    showToast(
        "💥 DAMAGE PROGRAM RESET"
    );

}


/* ============================================================
   047 — BUTTON CONNECTIONS
   ============================================================ */

DOM.resetScore.addEventListener(
    "click",
    resetScore
);


DOM.clearHistory.addEventListener(
    "click",
    clearHistory
);


DOM.restorePower.addEventListener(
    "click",
    restorePower
);


DOM.resetEverything.addEventListener(
    "click",
    resetEverything
);


/* ============================================================
   048 — FOUNDATION STARTUP
   ============================================================ */

loadState();

renderHistory();

updateInterface();


console.log(
    "DAMAGE PROGRAM™ — PART 1 FOUNDATION ONLINE"
);


/* ============================================================
   END PART 1/5
   ============================================================ */

</script>

</body>
</html>
