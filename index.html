<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#05070d"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<title>DAMAGE PROGRAM™ — Ultimate Disaster Control Center</title>


<style>

/* ============================================================
   DAMAGE PROGRAM™
   ULTIMATE DISASTER CONTROL CENTER
   FACTORY RESET
   PART 1 / 5
   FOUNDATION
   ============================================================ */


/* ============================================================
   001 — ROOT VARIABLES
   ============================================================ */

:root {

    --bg-0: #03040a;

    --bg-1: #060812;

    --bg-2: #0a0f1c;

    --bg-3: #101729;

    --panel: rgba(14, 20, 35, 0.88);

    --panel-solid: #101629;

    --panel-light: rgba(255,255,255,0.055);

    --panel-hover: rgba(255,255,255,0.075);

    --panel-active: rgba(255,255,255,0.11);

    --border: rgba(255,255,255,0.09);

    --border-strong: rgba(255,255,255,0.19);

    --text: #f5f7ff;

    --text-soft: #c8d0e5;

    --muted: #8792aa;

    --dim: #59637a;

    --cyan: #4cddff;

    --cyan-dark: #168db1;

    --blue: #4389ff;

    --purple: #a56cff;

    --purple-dark: #6038b4;

    --pink: #ff5ed5;

    --pink-dark: #b62c91;

    --red: #ff405b;

    --red-dark: #8e172b;

    --orange: #ff9d42;

    --yellow: #ffd65a;

    --green: #50e49a;

    --green-dark: #207a55;

    --water: #2698ff;

    --water-dark: #064da9;

    --ice: #dff7ff;

    --white: #ffffff;

    --black: #000000;

    --shadow-small:
        0 8px 24px rgba(0,0,0,0.25);

    --shadow:
        0 20px 60px rgba(0,0,0,0.38);

    --shadow-large:
        0 35px 100px rgba(0,0,0,0.55);

    --radius-small: 12px;

    --radius: 20px;

    --radius-large: 28px;

    --transition-fast: 120ms ease;

    --transition: 180ms ease;

    --transition-slow: 320ms ease;

}


/* ============================================================
   002 — GLOBAL RESET
   ============================================================ */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


html {

    width: 100%;

    min-height: 100%;

    margin: 0;

    padding: 0;

    background: var(--bg-0);

    scroll-behavior: smooth;

}


body {

    width: 100%;

    min-height: 100vh;

    margin: 0;

    padding: 0;

    color: var(--text);

    background: var(--bg-1);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    overflow-x: hidden;

}


button,
input,
select,
textarea {

    font: inherit;

}


button {

    border: 0;

}


button,
[role="button"] {

    -webkit-user-select: none;

    user-select: none;

}


button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {

    outline: 2px solid var(--cyan);

    outline-offset: 3px;

}


/* ============================================================
   003 — GLOBAL BACKGROUND
   ============================================================ */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    z-index: -20;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 7% 5%,
            rgba(76,221,255,0.13),
            transparent 30%
        ),

        radial-gradient(
            circle at 93% 8%,
            rgba(255,94,213,0.11),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 110%,
            rgba(165,108,255,0.12),
            transparent 43%
        );

}


body::after {

    content: "";

    position: fixed;

    inset: 0;

    z-index: -19;

    pointer-events: none;

    opacity: 0.07;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.05) 1px,
            transparent 1px
        );

    background-size: 100% 5px;

}


/* ============================================================
   004 — APP CONTAINER
   ============================================================ */

#app {

    width: min(1400px, 100%);

    min-height: 100vh;

    margin: 0 auto;

    padding: 18px;

}


@media (max-width: 700px) {

    #app {

        padding: 10px;

    }

}


/* ============================================================
   005 — GLASS
   ============================================================ */

.glass {

    background: var(--panel);

    border: 1px solid var(--border);

    box-shadow: var(--shadow);

    backdrop-filter:
        blur(20px)
        saturate(135%);

    -webkit-backdrop-filter:
        blur(20px)
        saturate(135%);

}


/* ============================================================
   006 — TOP BAR
   ============================================================ */

.topbar {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    padding: 18px;

    border-radius: var(--radius-large);

}


.brand {

    display: flex;

    align-items: center;

    min-width: 0;

    gap: 14px;

}


.logo {

    width: 58px;

    height: 58px;

    flex: 0 0 auto;

    display: grid;

    place-items: center;

    border: 1px solid rgba(255,255,255,0.13);

    border-radius: 18px;

    background:

        linear-gradient(
            145deg,
            #172640,
            #24152f
        );

    box-shadow:

        inset 0 0 30px
        rgba(76,221,255,0.09),

        0 0 35px
        rgba(76,221,255,0.05);

    font-size: 30px;

}


.brand-copy {

    min-width: 0;

}


.title-main {

    margin: 0;

    color: var(--text);

    font-size: clamp(23px, 5vw, 40px);

    font-weight: 950;

    line-height: 1;

    letter-spacing: -0.055em;

}


.title-sub {

    margin-top: 7px;

    color: var(--muted);

    font-size: 10px;

    font-weight: 850;

    letter-spacing: 0.17em;

}


.system-status {

    display: flex;

    align-items: center;

    flex: 0 0 auto;

    gap: 8px;

    color: var(--muted);

    font-size: 11px;

    font-weight: 850;

    white-space: nowrap;

}


.system-dot {

    width: 9px;

    height: 9px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 16px
        rgba(80,228,154,0.9);

}


/* ============================================================
   007 — NAVIGATION STRIP
   ============================================================ */

.nav-strip {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 12px;

    padding: 8px;

    border-radius: 18px;

    overflow-x: auto;

    scrollbar-width: none;

}


.nav-strip::-webkit-scrollbar {

    display: none;

}


.nav-button {

    flex: 0 0 auto;

    min-height: 38px;

    padding: 8px 13px;

    border: 1px solid var(--border);

    border-radius: 12px;

    color: var(--muted);

    background: rgba(255,255,255,0.025);

    font-size: 10px;

    font-weight: 900;

    cursor: pointer;

    transition:
        background var(--transition),
        border-color var(--transition),
        color var(--transition),
        transform var(--transition-fast);

}


.nav-button:hover {

    color: var(--text);

    background: var(--panel-hover);

    border-color: var(--border-strong);

}


.nav-button:active {

    transform: scale(0.96);

}


.nav-button.active {

    color: var(--text);

    border-color:
        rgba(76,221,255,0.3);

    background:
        rgba(76,221,255,0.09);

}


/* ============================================================
   008 — MAIN GRID
   ============================================================ */

.main-grid {

    display: grid;

    grid-template-columns:
        minmax(0, 1.22fr)
        minmax(310px, 0.78fr);

    align-items: start;

    gap: 16px;

    margin-top: 16px;

}


@media (max-width: 950px) {

    .main-grid {

        grid-template-columns: 1fr;

    }

    .system-status {

        display: none;

    }

}


/* ============================================================
   009 — CARD
   ============================================================ */

.card {

    padding: 18px;

    border-radius: var(--radius);

}


.card + .card {

    margin-top: 16px;

}


/* ============================================================
   010 — SCORE CARD
   ============================================================ */

.score-card {

    position: relative;

    overflow: hidden;

    padding: 30px 18px;

    text-align: center;

}


.score-card::before {

    content: "";

    position: absolute;

    left: 50%;

    top: -110px;

    width: 420px;

    height: 250px;

    transform: translateX(-50%);

    border-radius: 50%;

    background:

        radial-gradient(
            ellipse,
            rgba(76,221,255,0.12),
            transparent 70%
        );

    pointer-events: none;

}


.score-label {

    position: relative;

    color: var(--muted);

    font-size: 10px;

    font-weight: 950;

    letter-spacing: 0.23em;

}


.score-number {

    position: relative;

    margin: 11px 0;

    font-size: clamp(58px, 13vw, 112px);

    font-weight: 950;

    line-height: 0.92;

    letter-spacing: -0.075em;

    background:

        linear-gradient(
            90deg,
            var(--cyan),
            var(--pink),
            var(--purple)
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

}


.score-meta {

    position: relative;

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;

}


.pill {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-height: 30px;

    padding: 6px 11px;

    border: 1px solid var(--border);

    border-radius: 999px;

    color: var(--muted);

    background: rgba(255,255,255,0.025);

    font-size: 10px;

    font-weight: 850;

}


/* ============================================================
   011 — SECTION TITLE
   ============================================================ */

.section-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin: 2px 2px 12px;

}


.section-title h2 {

    margin: 0;

    font-size: 16px;

    font-weight: 950;

    letter-spacing: -0.025em;

}


.section-title span {

    color: var(--muted);

    font-size: 10px;

    font-weight: 750;

}


/* ============================================================
   012 — EVENT CENTER
   ============================================================ */

.categories {

    display: grid;

    gap: 10px;

}


/* ============================================================
   013 — CATEGORY
   ============================================================ */

.category {

    overflow: hidden;

    border: 1px solid var(--border);

    border-radius: 18px;

    background:
        rgba(5,8,17,0.54);

    transition:
        border-color var(--transition),
        background var(--transition),
        box-shadow var(--transition);

}


.category.open {

    border-color: var(--border-strong);

    background:
        rgba(8,12,24,0.76);

    box-shadow:
        0 12px 40px rgba(0,0,0,0.18);

}


/* ============================================================
   014 — CATEGORY HEADER
   ============================================================ */

.category-header {

    width: 100%;

    min-height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    padding: 14px;

    color: var(--text);

    background: transparent;

    text-align: left;

    cursor: pointer;

    touch-action: manipulation;

}


.category-header:active {

    background:
        rgba(255,255,255,0.04);

}


.category-left {

    display: flex;

    align-items: center;

    min-width: 0;

    gap: 12px;

}


.category-icon {

    width: 42px;

    height: 42px;

    flex: 0 0 auto;

    display: grid;

    place-items: center;

    border: 1px solid rgba(255,255,255,0.07);

    border-radius: 13px;

    background:
        rgba(255,255,255,0.045);

    font-size: 23px;

}


.category-copy {

    min-width: 0;

}


.category-name {

    display: block;

    overflow: hidden;

    color: var(--text);

    font-size: 14px;

    font-weight: 950;

    text-overflow: ellipsis;

    white-space: nowrap;

}


.category-description {

    display: block;

    margin-top: 3px;

    overflow: hidden;

    color: var(--muted);

    font-size: 10px;

    line-height: 1.35;

    text-overflow: ellipsis;

    white-space: nowrap;

}


.category-arrow {

    flex: 0 0 auto;

    color: var(--muted);

    font-size: 19px;

    transition:
        transform var(--transition);

}


.category.open .category-arrow {

    transform: rotate(180deg);

}


/* ============================================================
   015 — CATEGORY COLOR ACCENTS
   ============================================================ */

.category[data-theme="weather"] {

    --category-color: var(--cyan);

}


.category[data-theme="storm"] {

    --category-color: var(--purple);

}


.category[data-theme="tornado"] {

    --category-color: var(--red);

}


.category[data-theme="water"] {

    --category-color: var(--water);

}


.category[data-theme="fire"] {

    --category-color: var(--orange);

}


.category[data-theme="ice"] {

    --category-color: var(--ice);

}


.category[data-theme="earth"] {

    --category-color: #d99b68;

}


.category[data-theme="space"] {

    --category-color: var(--pink);

}


.category[data-theme="infrastructure"] {

    --category-color: var(--yellow);

}


.category[data-theme="chaos"] {

    --category-color: var(--red);

}


/* ============================================================
   016 — CATEGORY OPEN INDICATOR
   ============================================================ */

.category.open .category-icon {

    border-color:
        color-mix(
            in srgb,
            var(--category-color) 35%,
            transparent
        );

    box-shadow:

        inset 0 0 20px
        color-mix(
            in srgb,
            var(--category-color) 8%,
            transparent
        );

}


/* ============================================================
   017 — EVENT GRID
   ============================================================ */

.event-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 9px;

    padding: 0 10px 10px;

}


.event-grid[hidden] {

    display: none;

}


@media (max-width: 540px) {

    .event-grid {

        grid-template-columns: 1fr;

    }

}


/* ============================================================
   018 — EVENT BUTTON
   ============================================================ */

.event-button {

    position: relative;

    width: 100%;

    min-height: 88px;

    padding: 13px;

    overflow: hidden;

    border: 1px solid var(--border);

    border-radius: 15px;

    color: var(--text);

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,0.06),
            rgba(255,255,255,0.018)
        );

    text-align: left;

    cursor: pointer;

    transition:
        transform var(--transition-fast),
        border-color var(--transition),
        background var(--transition),
        box-shadow var(--transition);

    touch-action: manipulation;

}


.event-button::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            circle at 10% 0%,
            rgba(76,221,255,0.075),
            transparent 48%
        );

    pointer-events: none;

}


.event-button::after {

    content: "";

    position: absolute;

    top: 0;

    bottom: 0;

    left: -120%;

    width: 70%;

    transform: skewX(-20deg);

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.09),
            transparent
        );

    transition:
        left 500ms ease;

    pointer-events: none;

}


.event-button:hover {

    border-color: var(--border-strong);

    background: var(--panel-hover);

    transform: translateY(-2px);

    box-shadow:
        0 10px 28px rgba(0,0,0,0.18);

}


.event-button:hover::after {

    left: 145%;

}


.event-button:active {

    transform: scale(0.975);

}


.event-button[data-danger="true"] {

    border-color:
        rgba(255,64,91,0.17);

}


.event-button[data-danger="true"]:hover {

    border-color:
        rgba(255,64,91,0.38);

    box-shadow:
        0 10px 32px rgba(255,64,91,0.08);

}


.event-code {

    position: relative;

    display: block;

    color: var(--text);

    font-size: 14px;

    font-weight: 950;

}


.event-description {

    position: relative;

    display: block;

    margin-top: 5px;

    color: var(--muted);

    font-size: 10px;

    line-height: 1.35;

}


.event-points {

    position: relative;

    display: inline-block;

    margin-top: 7px;

    color: var(--yellow);

    font-size: 10px;

    font-weight: 950;

}


/* ============================================================
   019 — HISTORY
   ============================================================ */

.history {

    max-height: 500px;

    overflow-y: auto;

    overscroll-behavior: contain;

    scrollbar-width: thin;

}


.history::-webkit-scrollbar {

    width: 6px;

}


.history::-webkit-scrollbar-thumb {

    border-radius: 999px;

    background:
        rgba(255,255,255,0.12);

}


.history-empty {

    padding: 44px 10px;

    color: var(--muted);

    text-align: center;

    font-size: 12px;

}


.history-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    margin-bottom: 7px;

    padding: 11px 12px;

    border: 1px solid rgba(255,255,255,0.055);

    border-radius: 13px;

    background:
        rgba(255,255,255,0.032);

    font-size: 11px;

}


.history-main {

    min-width: 0;

}


.history-code {

    font-weight: 950;

}


.history-name {

    color: var(--muted);

}


.history-time {

    margin-top: 3px;

    color: var(--dim);

    font-size: 9px;

}


.history-points {

    flex: 0 0 auto;

    color: var(--yellow);

    font-weight: 950;

}


/* ============================================================
   020 — CONTROLS
   ============================================================ */

.control-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 9px;

}


.control-button {

    min-height: 52px;

    padding: 10px;

    border: 1px solid var(--border);

    border-radius: 14px;

    color: var(--text);

    background: #151b2c;

    cursor: pointer;

    transition:
        transform var(--transition-fast),
        border-color var(--transition),
        background var(--transition);

    touch-action: manipulation;

}


.control-button:hover {

    border-color: var(--border-strong);

    background: #1a2237;

}


.control-button:active {

    transform: scale(0.97);

}


.control-restore {

    border-color:
        rgba(80,228,154,0.22);

    background:
        rgba(16,43,34,0.95);

}


.control-danger {

    border-color:
        rgba(255,64,91,0.24);

    background:
        rgba(53,18,29,0.95);

}


/* ============================================================
   021 — EFFECT LAYER
   ============================================================ */

#effect-layer {

    position: fixed;

    inset: 0;

    z-index: 10000;

    overflow: hidden;

    pointer-events: none;

}


/* ============================================================
   022 — TOAST
   ============================================================ */

#toast {

    position: fixed;

    left: 50%;

    bottom:
        max(
            20px,
            env(safe-area-inset-bottom)
        );

    z-index: 50000;

    width: max-content;

    max-width:
        calc(100vw - 30px);

    padding: 12px 17px;

    border: 1px solid var(--border-strong);

    border-radius: 14px;

    background:
        rgba(10,14,25,0.96);

    box-shadow: var(--shadow);

    color: var(--text);

    font-size: 12px;

    font-weight: 900;

    text-align: center;

    opacity: 0;

    transform:
        translate(-50%, 20px);

    transition:
        opacity 180ms ease,
        transform 180ms ease;

    pointer-events: none;

}


#toast.visible {

    opacity: 1;

    transform:
        translate(-50%, 0);

}


/* ============================================================
   023 — CRITICAL ALERT
   ============================================================ */

.critical-alert {

    position: fixed;

    left: 50%;

    top:
        clamp(
            70px,
            13vh,
            150px
        );

    z-index: 30000;

    width:
        min(
            1000px,
            calc(100vw - 32px)
        );

    padding: 14px;

    transform:
        translateX(-50%);

    text-align: center;

    pointer-events: none;

    animation:
        critical-alert-life
        2800ms
        ease
        forwards;

}


.critical-alert-title {

    display: block;

    overflow-wrap: anywhere;

    color: var(--red);

    font-size:
        clamp(
            24px,
            7vw,
            58px
        );

    font-weight: 1000;

    line-height: 1.05;

    letter-spacing: 0.015em;

    text-shadow:

        0 0 8px
        rgba(255,64,91,0.9),

        0 0 28px
        rgba(255,64,91,0.55);

}


.critical-alert-sub {

    display: block;

    max-width: 100%;

    margin-top: 8px;

    color: #ffacb8;

    font-size:
        clamp(
            9px,
            2.5vw,
            13px
        );

    font-weight: 850;

    line-height: 1.4;

    letter-spacing: 0.11em;

    overflow-wrap: anywhere;

}


@keyframes critical-alert-life {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -18px)
            scale(0.92);

    }

    12% {

        opacity: 1;

        transform:
            translate(-50%, 0)
            scale(1);

    }

    76% {

        opacity: 1;

        transform:
            translate(-50%, 0)
            scale(1);

    }

    100% {

        opacity: 0;

        transform:
            translate(-50%, -8px)
            scale(1.03);

    }

}


/* ============================================================
   024 — PINK / PURPLE ALERT
   ============================================================ */

.pink-purple-alert
.critical-alert-title {

    background:

        linear-gradient(
            90deg,
            #ff63d5,
            #ff8de2,
            #a66cff,
            #7355ff,
            #ff63d5
        );

    background-size: 250% auto;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:
        pink-purple-flow
        1800ms
        linear
        infinite;

}


.pink-purple-alert
.critical-alert-sub {

    color: #dca9ff;

}


@keyframes pink-purple-flow {

    0% {

        background-position: 0% center;

    }

    100% {

        background-position: 250% center;

    }

}

function renderEventCenter() {

                wrapper.classList.add(

                );

            }


            wrapper.dataset.category =

            const header =
                document.createElement(
                    "button"
                );


            header.type =
                "button";


            header.className =
                "category-header";


            header.setAttribute(
                "aria-expanded",
                CATEGORY_STATE[category.id]
                    ? "true"
                    : "false"
            );

                <span class="category-left">

                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        ${category.icon}
                    </span>

                    <span class="category-copy">

                        </span>

                        <span class="category-description">
                            ${escapeHTML(category.description)}
                        </span>

                    aria-hidden="true"
                >
                    ▼
                </span>

            `;


            const grid =
                document.createElement(
                    "div"
                );


            grid.className =
                "event-grid";


            const inner =
                document.createElement(
                    "div"
                );


            inner.className =
                "event-grid-inner";


            category.events.forEach(
                code => {

                    const event =
                        getEvent(code);


                    if (!event) {

                        return;

                    }


                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "event-button";


                    button.dataset.code =
                        event.code;


                    button.dataset.danger =
                        event.danger
                            ? "true"
                            : "false";


                    button.innerHTML = `

                        <span class="event-code">
                            ${escapeHTML(event.icon)}
                            ${escapeHTML(event.code)}
                        </span>

                        <span class="event-description">
                            ${escapeHTML(event.name)}
                        </span>

                        <span class="event-points">
                            +${event.points}
                            ${event.bonus ? " BONUS" : ""}
                        </span>

                    `;


                    button.addEventListener(
                        "click",
                        () => {

                            triggerEvent(
                                event.code
                            );

                        }
                    );


                    inner.appendChild(
                        button
                    );

                }
            );


            grid.appendChild(
                inner
            );


            wrapper.appendChild(
                header
            );


            wrapper.appendChild(
                grid
            );


            header.addEventListener(
                "click",
                () => {

                    const currentlyOpen =
                        wrapper.classList.contains(
                            "open"
                        );


                    CATEGORY_STATE[category.id] =
                        !currentlyOpen;


                    wrapper.classList.toggle(
                        "open",
                        !currentlyOpen

                    header.setAttribute(
                        "aria-expanded",
                        !currentlyOpen
                            ? "true"
                            : "false"
                    );

                }
            );


            DOM.categories.appendChild(
                wrapper
            );

        }
    );

        APP.maxHistory

        STATE.history =
            STATE.history.slice(
                0,

    renderHistory();

    if (!event) {

            `Unknown event code: ${code}`

        return;

    const points =
        scoreEvent(
            event
        );


    const historyEntry =
        createHistoryEntry(
            event,
            STATE.score
        );


    addHistoryEntry(
        historyEntry

    handlePowerEvent(
        event

    updateInterface();

    saveState();


    createCriticalAlert(
        event

    eventShake(
        event
    );


    showEventToast(
        event
    );


    console.log(
        `[DAMAGE PROGRAM] ${event.code}: +${points}`
    );


    return points;

}

            return (

            );

        },
        0
    );

}

   ============================================================ */

function addVisualEffect(
    element,
    lifetime = 3000
) {

    const result =
        appendEffect(
            element
        );


    if (!result) {

        return null;

    }


    setTimeout(
        () => {

            if (
                element &&
                element.parentNode
            ) {

                element.remove();

            }

        },
        lifetime
    );


    return element;

}

            Date.now()

   ============================================================ */

function triggerEvent(
    code
) {

    const event =
        EVENT_MAP.get(
            code
        );


    if (!event) {

        console.warn(
            "Unknown event:",
            code
        );

        return;

    }


    STATE.score +=
        event.points;


    STATE.events +=
        1;


    addHistoryEntry(
        event,
        event.points
    );


    runEventEffect(
        event
    );


    eventFlash(
        event
    );


    animateScore();


    renderHistory();

    updateInterface();

    saveState();


    showToast(
        `${event.code}  +${event.points}`
    );

}

    STATE.score +=

                state.history.some(
                    item =>
                        item.code ===
                        "PINK"
                )
    }

];


/* ============================================================
   197 — ACHIEVEMENT CHECK
   ============================================================ */

function checkAchievements() {

    for (
        const achievement
        of ACHIEVEMENTS
    ) {

        if (
            STATE.achievements.includes(
                achievement.id
            )
        ) {

            continue;

        }


        if (
            achievement.test(
                STATE
            )
        ) {

            STATE.achievements.push(
                achievement.id
            );


            showToast(
                `🏆 ${achievement.name}`
            );


            particleBurst(
                18
            );

        }

    }

}

/* ============================================================
   204 — FINAL STATE NORMALIZATION
   ============================================================ */

function normalizeState() {

    STATE.score =
        Math.max(
            0,
            Number(
                STATE.score
            ) || 0
        );


    STATE.events =
        Math.max(
            0,
            Number(
                STATE.events
            ) || 0
        );


    if (
        !Array.isArray(
            STATE.history
        )
    ) {

        STATE.history =
            [];

    }


    if (
        !Array.isArray(
            STATE.achievements
        )
    ) {

        STATE.achievements =
            [];

    }


    if (
        typeof STATE.powerOut !==
        "boolean"
    ) {

        STATE.powerOut =
            false;

    }

}
