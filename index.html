<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damage Program™</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        text-align: center;
    }

    .container {
        max-width: 600px;
        margin: auto;
        padding: 25px;
    }

    h1 {
        font-size: 36px;
        margin-bottom: 5px;
    }

    .subtitle {
        font-size: 18px;
        opacity: 0.7;
    }

    #score {
        font-size: 80px;
        font-weight: bold;
        margin: 30px 0;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
    }

    button {
        font-size: 25px;
        font-weight: bold;
        padding: 22px;
        border: none;
        border-radius: 15px;
        background: white;
        color: black;
    }

    button:active {
        transform: scale(0.95);
    }

    .reset {
        margin-top: 20px;
        width: 100%;
        background: #333;
        color: white;
    }

    #message {
        margin-top: 20px;
        font-size: 20px;
        min-height: 25px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>⚔️ DAMAGE PROGRAM™</h1>
    <div class="subtitle">POINTS COUNTER</div>

    <div id="score">000</div>

    <div class="buttons">
        <button onclick="addPoints(1)">+1</button>
        <button onclick="addPoints(3)">+3</button>
        <button onclick="addPoints(5)">+5</button>
        <button onclick="addPoints(10)">+10</button>
        <button onclick="addPoints(20)">+20</button>
        <button onclick="addPoints(50)">+50</button>
        <button onclick="addPoints(75)">+75</button>
    </div>

    <button class="reset" onclick="resetScore()">🔄 RESET</button>

    <div id="message"></div>

</div>

<script>

let score = 0;

function updateScore() {
    document.getElementById("score").textContent =
        String(score).padStart(3, "0");
}

function addPoints(points) {
    score += points;

    document.getElementById("message").textContent =
        "+" + points + " POINTS!";

    updateScore();
}

function resetScore() {
    score = 0;

    document.getElementById("message").textContent =
        "SCORE RESET";

    updateScore();
}

</script>

</body>
</html>
