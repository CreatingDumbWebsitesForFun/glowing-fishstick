<div id="damage-program">

  <h1>⚠️ DAMAGE PROGRAM™</h1>
  <p class="dp-subtitle">V3 • DISASTER CONTROL</p>

  <!-- SCORE -->
  <div id="dp-score-box">
    <div id="dp-score">0</div>
    <div>POINTS</div>
  </div>

  <!-- CATEGORIES WILL GO HERE -->
  <div id="dp-categories"></div>

  <!-- EVENT HISTORY -->
  <div id="dp-history">
    <h2>📋 EVENT HISTORY</h2>
    <div id="dp-history-list"></div>
  </div>

</div>

<!-- VISUAL EFFECTS -->
<div id="dp-effects"></div>

<script>
<script>
/* =========================================
   DAMAGE PROGRAM™ V3
   EVENT DATABASE + CATEGORY ENGINE
   ========================================= */

const damageEvents = {

  "🌪️ TORNADO": [
    { code: "NADO",   points: 1,  effect: "tornado" },
    { code: "PDS",    points: 3,  effect: "pds" },
    { code: "DSTW",   points: 3,  effect: "dstw" },
    { code: "TE",     points: 10, effect: "te" },
    { code: "NADO-H", points: 7,  effect: "nado-house" },
    { code: "TE-H",   points: 15, effect: "te-house" }
  ],

  "☢️ NUKE": [
    { code: "NW",    points: 50, effect: "nuke-watch" },
    { code: "NUKE",  points: 75, effect: "nuke" },
    { code: "N10",   points: 75, effect: "nuke-10" },
    { code: "PINK",  points: 75, effect: "pink" }
  ],

  "🌊 FLOOD": [
    { code: "FW",  points: 1,  effect: "flood-watch" },
    { code: "SFW", points: 5,  effect: "flood-warning" },
    { code: "FLD", points: 10, effect: "flood" },
    { code: "FE",  points: 20, effect: "flood-emergency" }
  ],

  "🌀 HURRICANE": [
    { code: "TWS", points: 10, effect: "tws" },
    { code: "HW",  points: 25, effect: "hurricane-watch" },
    { code: "HUR", points: 50, effect: "hurricane" },
    { code: "HWN", points: 0,  effect: "hurricane-warning" }
  ],

  "🧊 HAIL": [
    { code: "1 IN HAIL", points: 1, effect: "hail", size: 1 },
    { code: "2 IN HAIL", points: 2, effect: "hail", size: 2 },
    { code: "3 IN HAIL", points: 3, effect: "hail", size: 3 },
    { code: "4 IN HAIL", points: 4, effect: "hail", size: 4 },
    { code: "5 IN HAIL", points: 5, effect: "hail", size: 5 },
    { code: "6 IN HAIL", points: 6, effect: "hail", size: 6 },
    { code: "7 IN HAIL", points: 7, effect: "hail", size: 7 },
    { code: "8 IN HAIL", points: 8, effect: "hail", size: 8 }
  ],

  "💨 OTHER": [
    { code: "EWW", points: 20, effect: "eww" },
    { code: "PO",  points: 7,  effect: "power-outage" },
    { code: "PR",  points: 25, effect: "power-restore" },
    { code: "RED", points: 5,  effect: "red" }
  ]

};


/* =========================================
   SCORE
   ========================================= */

let damageScore = 0;


/* =========================================
   BUILD CATEGORIES
   ========================================= */

const categoryContainer =
  document.getElementById("dp-categories");


for (const categoryName in damageEvents) {

  const category = document.createElement("div");

  category.className = "dp-category";


  const header = document.createElement("button");

  header.className = "dp-category-header";

  header.innerHTML = `
    <span>${categoryName}</span>
    <span>▼</span>
  `;


  const eventContainer = document.createElement("div");

  eventContainer.className = "dp-event-container";


  header.addEventListener("click", () => {

    eventContainer.classList.toggle("open");

  });


  category.appendChild(header);

  category.appendChild(eventContainer);

  categoryContainer.appendChild(category);


  /* =======================================
     CREATE EVENT BUTTONS
     ======================================= */

  damageEvents[categoryName].forEach(event => {

    const button = document.createElement("button");

    button.className = "dp-event-button";


    button.innerHTML = `
      <strong>${event.code}</strong>
      <span>+${event.points}</span>
    `;


    button.addEventListener("click", () => {

      activateDamageEvent(event);

    });


    eventContainer.appendChild(button);

  });

}


/* =========================================
   ACTIVATE EVENT
   ========================================= */

function activateDamageEvent(event) {

  damageScore += event.points;

  document.getElementById("dp-score").textContent =
    damageScore;


  addEventToHistory(event);


  /*
    Effects will be connected here
    in the next core.
  */

  if (typeof playDamageEffect === "function") {

    playDamageEffect(event);

  }

}


/* =========================================
   EVENT HISTORY
   ========================================= */

function addEventToHistory(event) {

  const history =
    document.getElementById("dp-history-list");


  const entry =
    document.createElement("div");


  entry.className = "dp-history-entry";


  entry.innerHTML = `
    <strong>${event.code}</strong>
    <span>+${event.points}</span>
  `;


  history.prepend(entry);

}
</script>

<script>
/* =========================================================
   DAMAGE PROGRAM™ V3
   EFFECT ENGINE
   ========================================================= */

const dpEffects =
  document.getElementById("dp-effects");


/* =========================================================
   MAIN EFFECT ROUTER
   ========================================================= */

function playDamageEffect(event) {

  switch (event.effect) {

    case "tornado":
      tornadoEffect(1);
      break;

    case "pds":
      tornadoEffect(3);
      break;

    case "dstw":
      tornadoEffect(3);
      break;

    case "te":
      tornadoEffect(10);
      break;

    case "nado-house":
      tornadoHouseEffect(7);
      break;

    case "te-house":
      tornadoHouseEffect(15);
      break;

    case "nuke-watch":
      warningEffect("☢️ NUKE WATCH");
      break;

    case "nuke":
      nukeEffect();
      break;

    case "nuke-10":
      warningEffect("☢️ 10-MINUTE NUKE WARNING");
      break;

    case "pink":
      pinkEffect();
      break;

    case "flood-watch":
      floodEffect(10);
      break;

    case "flood-warning":
      floodEffect(25);
      break;

    case "flood":
      floodEffect(50);
      break;

    case "flood-emergency":
      floodEffect(70);
      break;

    case "tws":
      hurricaneEffect();
      break;

    case "hurricane-watch":
      hurricaneEffect();
      break;

    case "hurricane":
      hurricaneEffect();
      break;

    case "hurricane-warning":
      hurricaneEffect();
      break;

    case "hail":
      hailEffect(event.size);
      break;

    case "eww":
      ewwEffect();
      break;

    case "power-outage":
      powerOutageEffect();
      break;

    case "power-restore":
      powerRestoreEffect();
      break;

    case "red":
      redEffect();
      break;
  }
}


/* =========================================================
   TORNADO
   ========================================================= */

function tornadoEffect(points) {

  const tornado =
    document.createElement("div");

  tornado.className = "dp-tornado";

  if (points >= 3)
    tornado.classList.add("pds");

  if (points >= 10)
    tornado.classList.add("te");

  dpEffects.appendChild(tornado);


  /* Pick up exactly as many buttons
     as the event is worth */

  const buttons =
    Array.from(
      document.querySelectorAll(".dp-event-button")
    );


  const count =
    Math.min(points, buttons.length);


  const selected =
    buttons
      .sort(() => Math.random() - 0.5)
      .slice(0, count);


  selected.forEach((button, index) => {

    setTimeout(() => {

      button.classList.add(
        "dp-button-picked"
      );

    }, index * 80);

  });


  createWindParticles(points * 3);


  setTimeout(() => {

    selected.forEach(button => {

      button.classList.remove(
        "dp-button-picked"
      );

    });

    tornado.remove();

  }, 3100);
}


/* =========================================================
   TORNADO + HOUSE
   ========================================================= */

function tornadoHouseEffect(points) {

  tornadoEffect(points);


  /*
    Look for an existing house element.
    If your website has one, give it the
    class "damage-house".
  */

  const house =
    document.querySelector(".damage-house");


  if (house) {

    setTimeout(() => {

      house.classList.add(
        "dp-house-hit"
      );

      setTimeout(() => {

        house.classList.remove(
          "dp-house-hit"
        );

      }, 2500);

    }, 1200);

  }
}


/* =========================================================
   WIND PARTICLES
   ========================================================= */

function createWindParticles(amount) {

  for (let i = 0; i < amount; i++) {

    const wind =
      document.createElement("div");

    wind.className = "dp-wind";

    wind.style.top =
      Math.random() * 90 + "%";

    wind.style.animationDelay =
      Math.random() * 0.8 + "s";

    dpEffects.appendChild(wind);


    setTimeout(() => {
      wind.remove();
    }, 1500);
  }
}


/* =========================================================
   FLOOD
   ========================================================= */

function floodEffect(height) {

  const water =
    document.createElement("div");

  water.className =
    "dp-flood-water";

  dpEffects.appendChild(water);


  /* Rain */

  createRain(
    height >= 50 ? 80 : 45
  );


  requestAnimationFrame(() => {

    water.style.height =
      height + "%";

  });


  /*
    Leave the water visible for a while,
    then slowly remove it.
  */

  const duration =
    height >= 70 ? 6000 : 4500;


  setTimeout(() => {

    water.style.height = "0%";

    setTimeout(() => {

      water.remove();

    }, 2500);

  }, duration);
}


/* =========================================================
   RAIN
   ========================================================= */

function createRain(amount) {

  for (let i = 0; i < amount; i++) {

    const drop =
      document.createElement("div");

    drop.className =
      "dp-rain";

    drop.style.left =
      Math.random() * 100 + "%";

    drop.style.animationDelay =
      Math.random() * 1 + "s";

    dpEffects.appendChild(drop);


    setTimeout(() => {

      drop.remove();

    }, 1800);
  }
}


/* =========================================================
   HAIL
   ========================================================= */

function hailEffect(size) {

  /*
    Visual size grows with hail size.
    1 inch = small
    8 inch = VERY large
  */

  const hailCount =
    Math.min(45, 15 + size * 3);


  for (let i = 0; i < hailCount; i++) {

    const hail =
      document.createElement("div");

    hail.className =
      "dp-hail";


    const pixelSize =
      6 + size * 2;


    hail.style.width =
      pixelSize + "px";

    hail.style.height =
      pixelSize + "px";


    hail.style.left =
      Math.random() * 100 + "%";


    hail.style.animationDuration =
      (0.55 + Math.random() * 0.5) + "s";


    dpEffects.appendChild(hail);


    setTimeout(() => {

      hail.remove();

    }, 1500);
  }
}

}

}
