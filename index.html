<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Damage Program™</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

body {
  padding: 18px;
  transition: background 0.2s;
}

#app {
  width: 100%;
  max-width: 850px;
  margin: auto;
}

/* ==============================
   HEADER
   ============================== */

h1 {
  margin: 0;
  font-size: 32px;
}

.subtitle {
  margin-top: 5px;
  opacity: 0.6;
}

/* ==============================
   SCORE
   ============================== */

#scoreBox {
  margin: 20px auto;
  padding: 20px;
  max-width: 280px;

  text-align: center;

  border-radius: 18px;

  background: #242424;
}

#score {
  font-size: 56px;
  font-weight: bold;
}

/* ==============================
   OPEN EVENTS
   ============================== */

#openEvents {
  width: 100%;
  min-height: 70px;

  border: 0;
  border-radius: 17px;

  background: #303030;
  color: white;

  font-size: 21px;
  font-weight: bold;

  cursor: pointer;

  touch-action: manipulation;
}

/* ==============================
   EVENT PANEL
   ============================== */

#eventPanel {
  display: none;
  margin-top: 12px;
}

#eventPanel.open {
  display: block;
}

/* ==============================
   CATEGORY
   ============================== */

.category {
  margin-bottom: 10px;

  border-radius: 16px;

  overflow: hidden;

  background: #202020;
}

.categoryButton {
  width: 100%;
  min-height: 65px;

  border: 0;

  background: #303030;
  color: white;

  text-align: left;

  padding: 15px;

  font-size: 20px;
  font-weight: bold;

  cursor: pointer;

  touch-action: manipulation;
}

.categoryButton:active {
  transform: scale(0.98);
}

/* ==============================
   EVENTS
   ============================== */

.events {
  display: none;

  padding: 10px;

  grid-template-columns: 1fr 1fr;

  gap: 9px;
}

.events.open {
  display: grid;
}

.eventButton {
  min-height: 68px;

  border: 0;
  border-radius: 13px;

  background: #414141;
  color: white;

  cursor: pointer;

  font-size: 17px;
  font-weight: bold;

  touch-action: manipulation;
}

.eventButton small {
  opacity: 0.75;
}

.eventButton:active {
  transform: scale(0.94);
}

/* ==============================
   HISTORY
   ============================== */

#historyBox {
  margin-top: 25px;

  padding: 15px;

  border-radius: 16px;

  background: #202020;
}

#historyBox h2 {
  margin-top: 0;
}

#history {
  max-height: 300px;

  overflow-y: auto;
}

.historyItem {
  display: flex;

  justify-content: space-between;

  padding: 10px;

  margin-bottom: 6px;

  border-radius: 9px;

  background: #303030;
}

/* ==============================
   RESET BUTTONS
   ============================== */

.resetButton {
  width: 100%;

  min-height: 58px;

  margin-top: 9px;

  border: 0;

  border-radius: 13px;

  background: #444;

  color: white;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

#resetEverything {
  background: #700000;
}

/* ==============================
   EFFECT LAYER
   ============================== */

#effects {
  position: fixed;

  inset: 0;

  pointer-events: none;

  overflow: hidden;

  z-index: 99999;
}

/* ==============================
   WIND
   ============================== */

.wind {
  position: absolute;

  width: 100px;
  height: 3px;

  border-radius: 50%;

  background: rgba(255,255,255,0.65);

  animation: wind 1s linear forwards;
}

@keyframes wind {

  from {
    transform: translateX(-150px);
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  to {
    transform: translateX(110vw);
    opacity: 0;
  }

}

/* ==============================
   TORNADO
   ============================== */

.tornado {

  position: absolute;

  left: -250px;
  bottom: 5%;

  width: 170px;
  height: 330px;

  background:
    linear-gradient(
      to bottom,
      transparent,
      rgba(130,130,130,0.5),
      rgba(50,50,50,0.9)
    );

  clip-path: polygon(
    44% 0,
    58% 0,
    68% 20%,
    73% 40%,
    65% 60%,
    53% 78%,
    48% 100%,
    38% 100%,
    43% 78%,
    31% 60%,
    27% 40%,
    34% 20%
  );

  animation: tornadoMove 3s linear forwards;

}

.tornado.big {
  width: 240px;
  height: 420px;
}

@keyframes tornadoMove {

  from {
    left: -250px;
  }

  to {
    left: 110vw;
  }

}

/* ==============================
   BUTTON PICKUP
   ============================== */

.flying {

  animation: flying 3s ease-in-out forwards;

}

@keyframes flying {

  0% {
    transform: translate(0,0) rotate(0);
  }

  20% {
    transform: translate(100px,-100px) rotate(120deg);
  }

  50% {
    transform: translate(200px,-20px) rotate(240deg);
  }

  75% {
    transform: translate(100px,100px) rotate(360deg);
  }

  100% {
    transform: translate(0,0) rotate(0);
  }

}

/* ==============================
   FLOOD
   ============================== */

.flood {

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 0;

  background:
    linear-gradient(
      to bottom,
      rgba(80,160,230,0.7),
      rgba(20,80,150,0.95)
    );

  border-top: 4px solid rgba(200,240,255,0.8);

  transition: height 2.5s ease;

}

.flood::before {

  content: "";

  position: absolute;

  left: -10%;

  top: -10px;

  width: 120%;
  height: 20px;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 25px,
      rgba(255,255,255,0.25) 25px 45px,
      transparent 45px 70px
    );

  animation: waves 1.4s linear infinite;

}

@keyframes waves {

  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-70px);
  }

}

/* ==============================
   RAIN
   ============================== */

.rain {

  position: absolute;

  width: 2px;
  height: 25px;

  background: rgba(180,220,255,0.7);

  animation: rain 0.7s linear forwards;

}

@keyframes rain {

  from {
    transform: translateY(-50px) rotate(15deg);
  }

  to {
    transform: translateY(110vh) rotate(15deg);
  }

}

/* ==============================
   HAIL
   ============================== */

.hail {

  position: absolute;

  top: -30px;

  border-radius: 50%;

  background: white;

  box-shadow: 0 0 5px white;

  animation: hail 1s linear forwards;

}

@keyframes hail {

  from {
    transform: translateY(-40px);
  }

  to {
    transform: translateY(110vh) rotate(360deg);
  }

}

/* ==============================
   HURRICANE
   ============================== */

.hurricane {

  position: absolute;

  left: 50%;
  top: 50%;

  width: 500px;
  height: 500px;

  border: 12px solid rgba(170,210,255,0.35);

  border-radius: 50%;

  transform: translate(-50%,-50%);

  animation: hurricane 2.5s linear forwards;

}

@keyframes hurricane {

  from {
    transform:
      translate(-50%,-50%)
      scale(.2)
      rotate(0);

    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  to {
    transform:
      translate(-50%,-50%)
      scale(1.5)
      rotate(720deg);

    opacity: 0;
  }

}

/* ==============================
   NUKE
   ============================== */

.nuke {

  position: absolute;

  top: -100px;
  left: 50%;

  transform: translateX(-50%);

  font-size: 70px;

  animation: nukeDrop 1.2s forwards;

}

@keyframes nukeDrop {

  to {
    top: 50%;
  }

}

/* ==============================
   EXPLOSION
   ============================== */

.explosion {

  position: absolute;

  left: 50%;
  top: 50%;

  width: 40px;
  height: 40px;

  transform: translate(-50%,-50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      white 0%,
      yellow 20%,
      orange 45%,
      red 65%,
      transparent 75%
    );

  animation: explosion 1.4s forwards;

}

@keyframes explosion {

  to {

    width: 900px;
    height: 900px;

    opacity: 0;

  }

}

/* ==============================
   SHAKE
   ============================== */

.shake {

  animation: shake .7s;

}

@keyframes shake {

  0% { transform: translate(0); }

  20% { transform: translate(-8px,4px); }

  40% { transform: translate(8px,-4px); }

  60% { transform: translate(-6px,3px); }

  80% { transform: translate(6px,-3px); }

  100% { transform: translate(0); }

}

/* ==============================
   POWER OUTAGE
   ============================== */

body.blackout {

  background: #020202;

}

body.blackout #app {

  filter: brightness(.04);

}

.flicker {

  animation: flicker 1.5s forwards;

}

@keyframes flicker {

  0% { filter: brightness(1); }

  10% { filter: brightness(.2); }

  20% { filter: brightness(1); }

  30% { filter: brightness(.1); }

  40% { filter: brightness(.8); }

  50% { filter: brightness(.15); }

  70% { filter: brightness(1); }

  100% { filter: brightness(.03); }

}

/* ==============================
   WARNING
   ============================== */

.warning {

  position: absolute;

  top: 30%;
  left: 50%;

  transform: translateX(-50%);

  padding: 20px;

  border-radius: 12px;

  background: rgba(160,0,0,.95);

  color: white;

  font-size: 25px;
  font-weight: bold;

  text-align: center;

  animation: warning 2s forwards;

}

@keyframes warning {

  0% {
    opacity: 0;
    transform: translateX(-50%) scale(.7);
  }

  20% {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  80% {
    opacity: 1;
  }

  100% {
    opacity: 0;
  }

}

/* ==============================
   MOBILE / IPAD
   ============================== */

@media (max-width: 600px) {

  body {
    padding: 12px;
  }

  .events {
    grid-template-columns: 1fr;
  }

  .eventButton {
    min-height: 72px;
    font-size: 18px;
  }

}

</style>
</head>

<body>

<div id="app">

  <h1>⚠️ DAMAGE PROGRAM™</h1>

  <div class="subtitle">
    V4 • DISASTER CONTROL
  </div>


  <!-- SCORE -->

  <div id="scoreBox">

    <div id="score">0</div>

    <div>POINTS</div>

  </div>


  <!-- OPEN EVENTS -->

  <button id="openEvents">
    ⚠️ OPEN EVENTS ▼
  </button>


  <!-- EVENTS -->

  <div id="eventPanel"></div>


  <!-- HISTORY -->

  <div id="historyBox">

    <h2>📋 EVENT HISTORY</h2>

    <div id="history"></div>

  </div>


  <!-- RESET -->

  <button
    id="resetScore"
    class="resetButton">

    🔄 RESET SCORE

  </button>


  <button
    id="clearHistory"
    class="resetButton">

    🗑️ CLEAR HISTORY

  </button>


  <button
    id="resetEverything"
    class="resetButton">

    💥 RESET EVERYTHING

  </button>

</div>


<!-- EFFECTS -->

<div id="effects"></div>


<script>

/* =========================================================
   DAMAGE PROGRAM™ V4
   SINGLE CORE
   ========================================================= */


/* ==============================
   SCORE
   ============================== */

let score = 0;


/* ==============================
   EVENT DATA
   ============================== */

const events = {

  "🌪️ TORNADO": [

    {
      code: "NADO",
      name: "Tornado",
      points: 1
    },

    {
      code: "PDS",
      name: "PDS",
      points: 3
    },

    {
      code: "DSTW",
      name: "Destructive Severe Thunderstorm Warning",
      points: 3
    },

    {
      code: "TE",
      name: "Tornado Emergency",
      points: 10
    },

    {
      code: "NADO-H",
      name: "Tornado hits house",
      points: 7
    },

    {
      code: "TE-H",
      name: "Tornado Emergency hits house",
      points: 15
    }

  ],


  "🌊 FLOOD": [

    {
      code: "FW",
      name: "Flood Watch",
      points: 1
    },

    {
      code: "SFW",
      name: "Flood Warning",
      points: 5
    },

    {
      code: "FLD",
      name: "Flood",
      points: 10
    },

    {
      code: "FE",
      name: "Flood Emergency",
      points: 20
    }

  ],


  "🌀 HURRICANE": [

    {
      code: "TWS",
      name: "Tropical Weather Statement",
      points: 10
    },

    {
      code: "HW",
      name: "Hurricane Watch",
      points: 25
    },

    {
      code: "HUR",
      name: "Hurricane",
      points: 50
    },

    {
      code: "HWN",
      name: "Hurricane Warning",
      points: 0
    }

  ],


  "☢️ NUKE": [

    {
      code: "NW",
      name: "Nuke Watch",
      points: 50
    },

    {
      code: "NUKE",
      name: "Nuke announced",
      points: 75
    },

    {
      code: "N10",
      name: "10-minute nuke warning",
      points: 75
    },

    {
      code: "PINK",
      name: "Pink / purple nuke text",
      points: 75
    }

  ],


  "💨 WIND / POWER": [

    {
      code: "EWW",
      name: "Extreme Wind Warning",
      points: 20
    },

    {
      code: "PO",
      name: "Power Outage",
      points: 7
    },

    {
      code: "PR",
      name: "Power Restoration",
      points: 25
    },

    {
      code: "RED",
      name: "Red server text",
      points: 5
    }

  ],


  "🧊 HAIL": [

    {
      code: "1 IN",
      name: "1 inch hail",
      points: 1,
      hail: 1
    },

    {
      code: "2 IN",
      name: "2 inch hail",
      points: 2,
      hail: 2
    },

    {
      code: "3 IN",
      name: "3 inch hail",
      points: 3,
      hail: 3
    },

    {
      code: "4 IN",
      name: "4 inch hail",
      points: 4,
      hail: 4
    },

    {
      code: "5 IN",
      name: "5 inch hail",
      points: 5,
      hail: 5
    },

    {
      code: "6 IN",
      name: "6 inch hail",
      points: 6,
      hail: 6
    },

    {
      code: "7 IN",
      name: "7 inch hail",
      points: 7,
      hail: 7
    },

    {
      code: "8 IN",
      name: "8 inch hail",
      points: 8,
      hail: 8
    }

  ]

};


/* =========================================================
   BUILD CATEGORIES
   ========================================================= */

const eventPanel =
  document.getElementById("eventPanel");


for (
  const categoryName in events
) {

  const category =
    document.createElement("div");

  category.className =
    "category";


  const categoryButton =
    document.createElement("button");

  categoryButton.className =
    "categoryButton";

  categoryButton.textContent =
    categoryName + " ▼";


  const eventList =
    document.createElement("div");

  eventList.className =
    "events";


  categoryButton.onclick = () => {

    const open =
      eventList.classList.toggle("open");

    categoryButton.textContent =
      categoryName +
      (open ? " ▲" : " ▼");

  };


  for (
    const event of events[categoryName]
  ) {

    const button =
      document.createElement("button");

    button.className =
      "eventButton";


    button.innerHTML = `
      <strong>${event.code}</strong>
      <br>
      <small>
        ${event.name}
        <br>
        +${event.points} points
      </small>
    `;


    button.onclick = () => {

      activateEvent(
        event,
        button
      );

    };


    eventList.appendChild(button);

  }


  category.appendChild(categoryButton);

  category.appendChild(eventList);

  eventPanel.appendChild(category);

}


/* =========================================================
   OPEN EVENTS
   ========================================================= */

document
  .getElementById("openEvents")
  .onclick = () => {

    const open =
      eventPanel.classList.toggle("open");

    document
      .getElementById("openEvents")
      .textContent =
      open
        ? "⚠️ CLOSE EVENTS ▲"
        : "⚠️ OPEN EVENTS ▼";

  };


/* =========================================================
   ACTIVATE EVENT
   ========================================================= */

function activateEvent(event, button) {

  score += event.points;

  document
    .getElementById("score")
    .textContent = score;


  addHistory(event);


  /* EFFECT */

  if (event.hail) {

    hailEffect(event.hail);

  }

  else if (event.code === "NADO") {

    tornadoEffect(1, button);

  }

  else if (
    event.code === "PDS" ||
    event.code === "DSTW"
  ) {

    tornadoEffect(3, button);

  }

  else if (event.code === "TE") {

    tornadoEffect(10, button);

  }

  else if (
    event.code === "NADO-H" ||
    event.code === "TE-H"
  ) {

    tornadoEffect(
      event.points,
      button
    );

    document.body.classList.add(
      "shake"
    );

    setTimeout(() => {
      document.body.classList.remove(
        "shake"
      );
    }, 800);

  }

  else if (
    event.code === "FW" ||
    event.code === "SFW" ||
    event.code === "FLD" ||
    event.code === "FE"
  ) {

    const heights = {
      FW: 10,
      SFW: 25,
      FLD: 50,
      FE: 75
    };

    floodEffect(
      heights[event.code]
    );

  }

  else if (
    event.code === "TWS" ||
    event.code === "HW" ||
    event.code === "HUR" ||
    event.code === "HWN"
  ) {

    hurricaneEffect();

  }

  else if (event.code === "NW") {

    warning("☢️ NUKE WATCH");

  }

  else if (event.code === "NUKE") {

    nukeEffect();

  }

  else if (event.code === "N10") {

    warning(
      "☢️ 10-MINUTE NUKE WARNING"
    );

  }

  else if (event.code === "PINK") {

    warning(
      "💜 ☢️ NUKE ALERT ☢️ 💜"
    );

  }

  else if (event.code === "EWW") {

    windEffect();

  }

  else if (event.code === "PO") {

    powerOutage();

  }

  else if (event.code === "PR") {

    powerRestore();

  }

  else if (event.code === "RED") {

    warning(
      "🔴 RED SERVER TEXT"
    );

  }

}


/* =========================================================
   HISTORY
   ========================================================= */

function addHistory(event) {

  const item =
    document.createElement("div");

  item.className =
    "historyItem";


  item.innerHTML = `
    <strong>${event.code}</strong>
    <span>
      +${event.points}
    </span>
  `;


  document
    .getElementById("history")
    .prepend(item);

}


/* =========================================================
   TORNADO
   ========================================================= */

function tornadoEffect(
  pickupAmount,
  sourceButton
) {

  const tornado =
    document.createElement("div");

  tornado.className =
    "tornado";


  if (pickupAmount >= 3) {

    tornado.classList.add(
      "big"
    );

  }


  document
    .getElementById("effects")
    .appendChild(tornado);


  /* PICK UP BUTTONS */

  const buttons =
    Array.from(
      document.querySelectorAll(
        ".eventButton"
      )
    );


  const picked =
    buttons
      .sort(
        () =>
          Math.random() - .5
      )
      .slice(
        0,
        Math.min(
          pickupAmount,
          buttons.length
        )
      );


  picked.forEach(
    (button, index) => {

      setTimeout(() => {

        button.classList.add(
          "flying"
        );

      }, index * 100);

    }
  );


  windEffect();


  setTimeout(() => {

    picked.forEach(
      button => {

        button.classList.remove(
          "flying"
        );

      }
    );

    tornado.remove();

  }, 3200);

}


/* =========================================================
   WIND
   ========================================================= */

function windEffect() {

  const effects =
    document.getElementById(
      "effects"
    );


  for (
    let i = 0;
    i < 15;
    i++
  ) {

    const wind =
      document.createElement(
        "div"
      );

    wind.className =
      "wind";


    wind.style.top =
      Math.random() * 100 +
      "%";


    wind.style.width =
      60 +
      Math.random() * 150 +
      "px";


    effects.appendChild(
      wind
    );


    setTimeout(
      () => wind.remove(),
      1300
    );

  }

}


/* =========================================================
   FLOOD
   ========================================================= */

function floodEffect(height) {

  const effects =
    document.getElementById(
      "effects"
    );


  const water =
    document.createElement(
      "div"
    );

  water.className =
    "flood";


  effects.appendChild(
    water
  );


  rainEffect(
    height >= 50
      ? 45
      : 25
  );


  requestAnimationFrame(
    () => {

      water.style.height =
        height + "%";

    }
  );


  setTimeout(() => {

    water.style.height =
      "0";

    setTimeout(
      () => water.remove(),
      2500
    );

  }, 4500);

}


/* =========================================================
   RAIN
   ========================================================= */

function rainEffect(amount) {

  const effects =
    document.getElementById(
      "effects"
    );


  for (
    let i = 0;
    i < amount;
    i++
  ) {

    const drop =
      document.createElement(
        "div"
      );

    drop.className =
      "rain";


    drop.style.left =
      Math.random() * 100 +
      "%";


    drop.style.animationDelay =
      Math.random() +
      "s";


    effects.appendChild(
      drop
    );


    setTimeout(
      () => drop.remove(),
      1800
    );

  }

}


/* =========================================================
   HAIL
   ========================================================= */

function hailEffect(size) {

  const effects =
    document.getElementById(
      "effects"
    );


  /*
    Bigger hail = bigger balls,
    not an unlimited number
    of objects.
  */

  const amount =
    Math.min(
      35,
      10 + size * 2
    );


  for (
    let i = 0;
    i < amount;
    i++
  ) {

    const hail =
      document.createElement(
        "div"
      );

    hail.className =
      "hail";


    const pixels =
      5 + size * 2;


    hail.style.width =
      pixels + "px";

    hail.style.height =
      pixels + "px";


    hail.style.left =
      Math.random() * 100 +
      "%";


    hail.style.animationDuration =
      .6 +
      Math.random() * .5 +
      "s";


    effects.appendChild(
      hail
    );


    setTimeout(
      () => hail.remove(),
      1600
    );

  }

}


/* =========================================================
   HURRICANE
   ========================================================= */

function hurricaneEffect() {

  const effects =
    document.getElementById(
      "effects"
    );


  const storm =
    document.createElement(
      "div"
    );

  storm.className =
    "hurricane";


  effects.appendChild(
    storm
  );


  rainEffect(60);


  setTimeout(
    () => storm.remove(),
    2800
  );

}


/* =========================================================
   NUKE
   ========================================================= */

function nukeEffect() {

  const effects =
    document.getElementById(
      "effects"
    );


  const nuke =
    document.createElement(
      "div"
    );

  nuke.className =
    "nuke";

  nuke.textContent =
    "☢️";


  effects.appendChild(
    nuke
  );


  setTimeout(() => {

    nuke.remove();


    const explosion =
      document.createElement(
        "div"
      );

    explosion.className =
      "explosion";


    effects.appendChild(
      explosion
    );


    document.body.classList.add(
      "shake"
    );


    setTimeout(() => {

      document.body.classList.remove(
        "shake"
      );

    }, 800);


    setTimeout(
      () => explosion.remove(),
      1500
    );

  }, 1200);

}


/* =========================================================
   WARNING
   ========================================================= */

function warning(text) {

  const element =
    document.createElement(
      "div"
    );

  element.className =
    "warning";

  element.textContent =
    text;


  document
    .getElementById("effects")
    .appendChild(
      element
    );


  setTimeout(
    () => element.remove(),
    2200
  );

}


/* =========================================================
   POWER OUTAGE
   ========================================================= */

function powerOutage() {

  document.body.classList.add(
    "flicker"
  );


  setTimeout(() => {

    document.body.classList.remove(
      "flicker"
    );

    document.body.classList.add(
      "blackout"
    );

  }, 1500);

}


/* =========================================================
   POWER RESTORATION
   ========================================================= */

function powerRestore() {

  document.body.classList.remove(
    "blackout"
  );


  document.body.classList.remove(
    "flicker"
  );

}


/* =========================================================
   RESET SCORE
   ========================================================= */

document
  .getElementById("resetScore")
  .onclick = () => {

    score = 0;

    document
      .getElementById("score")
      .textContent = "0";

  };


/* =========================================================
   CLEAR HISTORY
   ========================================================= */

document
  .getElementById("clearHistory")
  .onclick = () => {

    document
      .getElementById("history")
      .innerHTML = "";

  };


/* =========================================================
   RESET EVERYTHING
   ========================================================= */

document
  .getElementById("resetEverything")
  .onclick = () => {

    score = 0;


    document
      .getElementById("score")
      .textContent = "0";


    document
      .getElementById("history")
      .innerHTML = "";


    document
      .getElementById("effects")
      .innerHTML = "";


    document.body.classList.remove(
      "blackout"
    );

    document.body.classList.remove(
      "flicker"
    );

    document.body.classList.remove(
      "shake"
    );

  };

</script>

</body>
</html>
