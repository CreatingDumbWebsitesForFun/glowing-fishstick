<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damage Program™</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        text-align: center;
    }

    .container {
        max-width: 600px;
        margin: auto;
        padding: 25px;
    }

    h1 {
        font-size: 36px;
        margin-bottom: 5px;
    }

    .subtitle {
        font-size: 18px;
        opacity: 0.7;
    }

    #score {
        font-size: 80px;
        font-weight: bold;
        margin: 30px 0;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
    }

    button {
        font-size: 25px;
        font-weight: bold;
        padding: 22px;
        border: none;
        border-radius: 15px;
        background: white;
        color: black;
    }

    button:active {
        transform: scale(0.95);
    }

    .reset {
        margin-top: 20px;
        width: 100%;
        background: #333;
        color: white;
    }

    #message {
        margin-top: 20px;
        font-size: 20px;
        min-height: 25px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>⚔️ DAMAGE PROGRAM™</h1>
    <div class="subtitle">POINTS COUNTER</div>

    <div id="score">000</div>

    <div class="buttons">
        <button onclick="addPoints(1)">+1</button>
        <button onclick="addPoints(3)">+3</button>
        <button onclick="addPoints(5)">+5</button>
        <button onclick="addPoints(10)">+10</button>
        <button onclick="addPoints(20)">+20</button>
        <button onclick="addPoints(50)">+50</button>
        <button onclick="addPoints(75)">+75</button>
    </div>

    <button class="reset" onclick="resetScore()">🔄 RESET</button>

    <div id="message"></div>

</div>

<script>

let score = 0;

function updateScore() {
    document.getElementById("score").textContent =
        String(score).padStart(3, "0");
}

function addPoints(points) {
    score += points;

    document.getElementById("message").textContent =
        "+" + points + " POINTS!";

    updateScore();
}

function resetScore() {
    score = 0;

    document.getElementById("message").textContent =
        "SCORE RESET";

    updateScore();
}

</script>

<style>
  .damage-program-v2 {
    margin: 30px auto;
    max-width: 760px;
    padding: 20px;
    border-radius: 22px;
    background: rgba(255,255,255,0.08);

  .damage-program-v2 h2 {

  }

  .dp-score-number {
    font-size: 75px;
    font-weight: 900;
    line-height: 1;
  }

  .dp-score-label {
    letter-spacing: 4px;
    opacity: 0.7;
    font-weight: bold;
  }

  .dp-group {
    margin: 10px 0;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(255,255,255,0.07);
  }

  .dp-dropdown {
    width: 100%;
    padding: 16px;
    border: none;
    background: transparent;
    color: white;
    font-size: 19px;
    font-weight: 800;
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
  }

  .dp-arrow {
    transition: transform 0.2s;
  }

  .dp-group.open .dp-arrow {
    transform: rotate(180deg);
  }

  .dp-items {
    display: none;
    padding: 0 10px 10px;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .dp-group.open .dp-items {
    display: grid;
  }

  .dp-event {
    border: none;
    border-radius: 12px;
    padding: 13px;
    background: rgba(255,255,255,0.10);
    color: white;
    text-align: left;
    font-weight: 800;
    cursor: pointer;
  }

  .dp-event:active {
    transform: scale(0.97);
  }

  .dp-points {
    display: block;
    margin-top: 3px;
    font-size: 12px;
    opacity: 0.65;
  }

  /* Effects */
  #dp-effects {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 9999;
  }

  .dp-rain {
    position: absolute;
    top: -30px;
    width: 2px;
    height: 24px;
    background: #9bd4ff;
    animation: dpRain 1s linear forwards;
  }

  @keyframes dpRain {
    to {
      transform: translateY(110vh);
      opacity: 0;
    }
  }

  .dp-wind {
    position: absolute;
    left: -40%;
    height: 3px;
    width: 65%;
    background: rgba(255,255,255,0.65);
    border-radius: 5px;
    animation: dpWind 1.1s forwards;
  }

  @keyframes dpWind {
    to {
      left: 120%;
      opacity: 0;
    }
  }

  .dp-hail {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: white;
    animation: dpHail 1.1s linear forwards;
  }

  @keyframes dpHail {
    to {
      transform: translateY(110vh);
      opacity: 0;
    }
  }

  .dp-flash {
    position: absolute;
    inset: 0;
    background: white;
    animation: dpFlash 0.35s;
  }

  @keyframes dpFlash {
    20% { opacity: 0.8; }
    45% { opacity: 0; }
    65% { opacity: 0.5; }
    100% { opacity: 0; }
  }

  .dp-tornado {
    position: absolute;
    left: -100px;
    top: 35%;
    font-size: 90px;
    animation: dpTornado 1.3s forwards;
  }

  @keyframes dpTornado {
    to {
      left: 110%;
      transform: rotate(720deg);
      opacity: 0;
    }
  }

  .dp-boom {
    position: absolute;
    left: 50%;
    top: 50%;
    font-size: 110px;
    animation: dpBoom 0.9s forwards;
  }

  @keyframes dpBoom {
    to {
      transform: scale(1.8);
      opacity: 0;
    }
  }
</style>


<div class="damage-program-v2">

  </div>


  <!-- OTHER -->
  <div class="dp-group">

    <button class="dp-dropdown" onclick="dpToggle(this)">

    <div class="dp-items">

      <button class="dp-event" onclick="dpAdd('FW',1,'rain')">
        FW

      </button>

      <button class="dp-event" onclick="dpAdd('SFW',5,'rain')">
        SFW
        <span class="dp-points">+5 · Flood Warning</span>
      </button>

        FLD
        <span class="dp-points">+10 · Flood</span>
      </button>

      <button class="dp-event" onclick="dpAdd('FE',20,'rain')">

        <span class="dp-points">+20 · Flood Emergency</span>
      </button>

      <button class="dp-event" onclick="dpAdd('TWS',10,'wind')">

        <span class="dp-points">+10 · Tropical Weather Statement</span>

      <button class="dp-event" onclick="dpAdd('HW',25,'wind')">

  </div>

<div id="dp-effects"></div>


<script>

let dpScore = 0;


function dpToggle(button) {

  button.parentElement.classList.toggle("open");

}


function dpAdd(code, points, effect) {

  dpScore += points;

  document.getElementById("dp-score-number").textContent = dpScore;

  dpPlayEffect(effect);

}


function dpPlayEffect(type) {

  const box = document.getElementById("dp-effects");

  box.innerHTML = "";


  if (type === "rain") {

    for (let i = 0; i < 35; i++) {

      const x = document.createElement("i");

      x.className = "dp-rain";

      x.style.left = Math.random() * 100 + "%";

      x.style.animationDelay = Math.random() * 0.3 + "s";

      box.appendChild(x);

    }

  }


  if (type === "hail") {

    for (let i = 0; i < 35; i++) {

      const x = document.createElement("i");

      x.className = "dp-hail";

      x.style.left = Math.random() * 100 + "%";

      x.style.animationDelay = Math.random() * 0.3 + "s";

      box.appendChild(x);

    }

  }


  if (type === "wind") {

    for (let i = 0; i < 9; i++) {

      const x = document.createElement("i");

      x.className = "dp-wind";

      x.style.top = (10 + i * 10) + "%";

      x.style.animationDelay = Math.random() * 0.3 + "s";

      box.appendChild(x);

    }

  }


  if (type === "flash") {

    const x = document.createElement("i");

    x.className = "dp-flash";

    box.appendChild(x);

  }


  if (type === "tornado") {

    const x = document.createElement("i");

    x.className = "dp-tornado";

    x.textContent = "🌪️";

    box.appendChild(x);

  }


  if (type === "boom") {

    const x = document.createElement("i");

    x.className = "dp-boom";

    x.textContent = "☢️💥";

    box.appendChild(x);

  }


  setTimeout(function() {

    box.innerHTML = "";

  }, 1500);

}

</script>
