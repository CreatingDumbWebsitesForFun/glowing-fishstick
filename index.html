<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#080b14">

<title>Damage Program™ — Ultimate Control Center</title>

<style>

/* ============================================================
   DAMAGE PROGRAM™
   FACTORY RESET — MEGA CORE
   VANILLA HTML / CSS / JAVASCRIPT
   ============================================================ */

/* ============================================================
   001 — ROOT
   ============================================================ */

:root {

    --background:
        #070910;

    --background-2:
        #0b0f1c;

    --panel:
        rgba(17, 22, 40, 0.82);

    --panel-solid:
        #111628;

    --panel-light:
        rgba(255,255,255,0.055);

    --border:
        rgba(255,255,255,0.11);

    --border-bright:
        rgba(255,255,255,0.20);

    --text:
        #f5f7ff;

    --muted:
        #9da8c4;

    --cyan:
        #54dcff;

    --blue:
        #4287ff;

    --purple:
        #a56cff;

    --pink:
        #ff5fd5;

    --red:
        #ff405b;

    --red-dark:
        #7d1729;

    --orange:
        #ff9d42;

    --yellow:
        #ffd85a;

    --green:
        #50e49a;

    --water:
        #238fff;

    --water-dark:
        #0752b8;

    --shadow:
        0 25px 80px rgba(0,0,0,0.42);

    --radius:
        22px;

    --small-radius:
        14px;

    --transition:
        180ms ease;

}


/* ============================================================
   002 — UNIVERSAL
   ============================================================ */

* {

    box-sizing:
        border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html {

    margin:
        0;

    padding:
        0;

    min-height:
        100%;

    background:
        var(--background);

}


body {

    margin:
        0;

    padding:
        0;

    min-height:
        100vh;

    color:
        var(--text);

    background:
        var(--background);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        system-ui,
        sans-serif;

    overflow-x:
        hidden;

}


button {

    font:
        inherit;

}


button:focus-visible {

    outline:
        2px solid var(--cyan);

    outline-offset:
        2px;

}


/* ============================================================
   003 — BACKGROUND
   ============================================================ */

body::before {

    content:
        "";

    position:
        fixed;

    inset:
        0;

    pointer-events:
        none;

    z-index:
        -10;

    background:

        radial-gradient(
            circle at 12% 8%,
            rgba(84,220,255,0.13),
            transparent 30%
        ),

        radial-gradient(
            circle at 88% 18%,
            rgba(255,95,213,0.12),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(165,108,255,0.10),
            transparent 40%
        );

}


body::after {

    content:
        "";

    position:
        fixed;

    inset:
        0;

    pointer-events:
        none;

    z-index:
        -9;

    opacity:
        0.12;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.035) 1px,
            transparent 1px
        );

    background-size:
        100% 4px;

}


/* ============================================================
   004 — APP
   ============================================================ */

#app {

    width:
        min(1200px, 100%);

    margin:
        0 auto;

    padding:
        16px;

}


@media (max-width: 600px) {

    #app {

        padding:
            10px;

    }

}


/* ============================================================
   005 — GLASS
   ============================================================ */

.glass {

    background:
        var(--panel);

    border:
        1px solid var(--border);

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

}


/* ============================================================
   006 — HEADER
   ============================================================ */

.topbar {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        15px;

    padding:
        18px;

    border-radius:
        var(--radius);

}


.brand {

    display:
        flex;

    align-items:
        center;

    gap:
        13px;

}


.logo {

    width:
        54px;

    height:
        54px;

    display:
        grid;

    place-items:
        center;

    border-radius:
        17px;

    font-size:
        28px;

    background:
        linear-gradient(
            145deg,
            #17243e,
            #241633
        );

    box-shadow:
        inset 0 0 25px rgba(84,220,255,0.10);

}


.title-main {

    margin:
        0;

    font-size:
        clamp(23px, 5vw, 36px);

    line-height:
        1;

    letter-spacing:
        -0.045em;

}


.title-sub {

    margin-top:
        6px;

    color:
        var(--muted);

    font-size:
        11px;

    letter-spacing:
        0.14em;

    font-weight:
        700;

}


.system-status {

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    color:
        var(--muted);

    font-size:
        12px;

    white-space:
        nowrap;

}


.system-dot {

    width:
        9px;

    height:
        9px;

    border-radius:
        50%;

    background:
        var(--green);

    box-shadow:
        0 0 15px var(--green);

}


/* ============================================================
   007 — LAYOUT
   ============================================================ */

.main-grid {

    display:
        grid;

    grid-template-columns:
        minmax(0, 1.2fr)
        minmax(280px, 0.8fr);

    gap:
        16px;

    margin-top:
        16px;

}


@media (max-width: 850px) {

    .main-grid {

        grid-template-columns:
            1fr;

    }

    .system-status {

        display:
            none;

    }

}


/* ============================================================
   008 — CARDS
   ============================================================ */

.card {

    padding:
        18px;

    border-radius:
        var(--radius);

}


.card + .card {

    margin-top:
        16px;

}


/* ============================================================
   009 — SCORE
   ============================================================ */

.score-card {

    text-align:
        center;

    padding:
        28px 18px;

}


.score-label {

    color:
        var(--muted);

    font-size:
        11px;

    font-weight:
        850;

    letter-spacing:
        0.20em;

}


.score-number {

    margin:
        9px 0;

    font-size:
        clamp(55px, 13vw, 105px);

    line-height:
        0.95;

    font-weight:
        950;

    letter-spacing:
        -0.07em;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--pink),
            var(--purple)
        );

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color:
        transparent;

}


.score-meta {

    display:
        flex;

    justify-content:
        center;

    flex-wrap:
        wrap;

    gap:
        8px;

}


.pill {

    padding:
        7px 11px;

    border:
        1px solid var(--border);

    border-radius:
        999px;

    color:
        var(--muted);

    font-size:
        11px;

    background:
        rgba(255,255,255,0.025);

}


/* ============================================================
   010 — SECTION TITLE
   ============================================================ */

.section-title {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

    margin:
        2px 2px 12px;

}


.section-title h2 {

    margin:
        0;

    font-size:
        16px;

    letter-spacing:
        -0.02em;

}


.section-title span {

    color:
        var(--muted);

    font-size:
        11px;

}


/* ============================================================
   011 — CATEGORY CONTAINER
   ============================================================ */

.categories {

    display:
        grid;

    gap:
        10px;

}


.category {

    overflow:
        hidden;

    border:
        1px solid var(--border);

    border-radius:
        18px;

    background:
        rgba(7,10,20,0.55);

}


.category-header {

    width:
        100%;

    border:
        0;

    color:
        var(--text);

    background:
        transparent;

    padding:
        16px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    text-align:
        left;

    cursor:
        pointer;

    touch-action:
        manipulation;

}


.category-header:active {

    background:
        rgba(255,255,255,0.035);

}


.category-left {

    display:
        flex;

    align-items:
        center;

    gap:
        12px;

}


.category-icon {

    width:
        38px;

    height:
        38px;

    display:
        grid;

    place-items:
        center;

    font-size:
        23px;

    border-radius:
        12px;

    background:
        rgba(255,255,255,0.05);

}


.category-name {

    display:
        block;

    font-weight:
        900;

}


.category-description {

    display:
        block;

    margin-top:
        2px;

    color:
        var(--muted);

    font-size:
        11px;

}


.category-arrow {

    color:
        var(--muted);

    font-size:
        20px;

    transition:
        transform var(--transition);

}


.category.open .category-arrow {

    transform:
        rotate(180deg);

}


/* ============================================================
   012 — EVENT GRID
   ============================================================ */

.event-grid {

    display:
        none;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap:
        9px;

    padding:
        0 10px 10px;

}


.category.open .event-grid {

    display:
        grid;

}


@media (max-width: 540px) {

    .event-grid {

        grid-template-columns:
            1fr;

    }

}


/* ============================================================
   013 — EVENT BUTTON
   ============================================================ */

.event-button {

    position:
        relative;

    min-height:
        80px;

    padding:
        13px;

    border:
        1px solid var(--border);

    border-radius:
        15px;

    color:
        var(--text);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.065),
            rgba(255,255,255,0.018)
        );

    text-align:
        left;

    cursor:
        pointer;

    transition:
        transform var(--transition),
        border-color var(--transition),
        background var(--transition);

    overflow:
        hidden;

    touch-action:
        manipulation;

}


.event-button::after {

    content:
        "";

    position:
        absolute;

    inset:
        0;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.07),
            transparent
        );

    transform:
        translateX(-120%);

    transition:
        transform 500ms ease;

}


.event-button:hover::after {

    transform:
        translateX(120%);

}


.event-button:hover {

    transform:
        translateY(-2px);

    border-color:
        var(--border-bright);

}


.event-button:active {

    transform:
        scale(0.975);

}


.event-code {

    display:
        block;

    font-size:
        14px;

    font-weight:
        950;

}


.event-description {

    display:
        block;

    margin-top:
        4px;

    color:
        var(--muted);

    font-size:
        11px;

    line-height:
        1.35;

}


.event-points {

    display:
        inline-block;

    margin-top:
        5px;

    color:
        var(--yellow);

    font-size:
        11px;

    font-weight:
        900;

}


/* ============================================================
   014 — HISTORY
   ============================================================ */

.history {

    max-height:
        410px;

    overflow:
        auto;

}


.history-empty {

    padding:
        38px 10px;

    color:
        var(--muted);

    text-align:
        center;

    font-size:
        13px;

}


.history-row {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        12px;

    margin-bottom:
        7px;

    padding:
        11px 12px;

    border:
        1px solid rgba(255,255,255,0.055);

    border-radius:
        13px;

    background:
        rgba(255,255,255,0.035);

    font-size:
        12px;

}


.history-points {

    color:
        var(--yellow);

    font-weight:
        900;

    white-space:
        nowrap;

}


/* ============================================================
   015 — CONTROLS
   ============================================================ */

.control-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap:
        9px;

}


.control-button {

    min-height:
        48px;

    border:
        1px solid var(--border);

    border-radius:
        14px;

    color:
        var(--text);

    background:
        #151b2c;

    cursor:
        pointer;

    touch-action:
        manipulation;

}


.control-button:active {

    transform:
        scale(0.97);

}


.control-restore {

    background:
        rgba(16,43,34,0.95);

    border-color:
        rgba(80,228,154,0.25);

}


.control-danger {

    background:
        rgba(53,18,29,0.95);

    border-color:
        rgba(255,64,91,0.25);

}


/* ============================================================
   016 — EFFECT LAYER
   ============================================================ */

#effect-layer {

    position:
        fixed;

    inset:
        0;

    z-index:
        10000;

    overflow:
        hidden;

    pointer-events:
        none;

}


/* ============================================================
   017 — TOAST
   ============================================================ */

#toast {

    position:
        fixed;

    left:
        50%;

    bottom:
        22px;

    z-index:
        30000;

    max-width:
        calc(100vw - 30px);

    padding:
        13px 18px;

    border:
        1px solid var(--border);

    border-radius:
        14px;

    background:
        rgba(13,17,29,0.95);

    box-shadow:
        var(--shadow);

    color:
        var(--text);

    font-size:
        13px;

    font-weight:
        900;

    text-align:
        center;

    opacity:
        0;

    transform:
        translate(-50%, 20px);

    transition:
        opacity 220ms ease,
        transform 220ms ease;

}


#toast.visible {

    opacity:
        1;

    transform:
        translate(-50%, 0);

}


/* ============================================================
   018 — CRITICAL TEXT
   ============================================================ */

.critical-alert {

    position:
        fixed;

    left:
        50%;

    top:
        14%;

    z-index:
        20000;

    width:
        min(900px, 92vw);

    transform:
        translateX(-50%);

    text-align:
        center;

    color:
        var(--red);

    text-shadow:
        0 0 8px rgba(255,64,91,0.8),
        0 0 30px rgba(255,64,91,0.55);

    animation:
        critical-in-out 2.7s ease forwards;

}


.critical-alert-title {

    display:
        block;

    font-size:
        clamp(24px, 7vw, 54px);

    font-weight:
        1000;

    letter-spacing:
        0.025em;

}


.critical-alert-sub {

    display:
        block;

    margin-top:
        7px;

    color:
        #ff9eac;

    font-size:
        12px;

    font-weight:
        800;

    letter-spacing:
        0.12em;

}


@keyframes critical-in-out {

    0% {

        opacity:
            0;

        transform:
            translate(-50%, -15px)
            scale(0.90);

    }

    12% {

        opacity:
            1;

        transform:
            translate(-50%, 0)
            scale(1);

    }

    72% {

        opacity:
            1;

        transform:
            translate(-50%, 0)
            scale(1);

    }

    100% {

        opacity:
            0;

        transform:
            translate(-50%, -8px)
            scale(1.04);

    }

}


/* ============================================================
   019 — PINK / PURPLE ALERT
   ============================================================ */

.pink-purple-alert {

    color:
        var(--pink);

    text-shadow:
        0 0 10px rgba(255,95,213,0.75),
        0 0 35px rgba(165,108,255,0.60);

}


.pink-purple-alert .critical-alert-title {

    background:
        linear-gradient(
            90deg,
            #ff73dc,
            #a56cff,
            #ff73dc
        );

    background-size:
        200% auto;

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color:
        transparent;

    animation:
        pink-gradient 1.6s linear infinite;

}


@keyframes pink-gradient {

    to {

        background-position:
            200% center;

    }

}


/* ============================================================
   020 — WIND
   ============================================================ */

.wind-gust {

    position:
        absolute;

    left:
        -220px;

    height:
        3px;

    border-radius:
        999px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(220,245,255,0.95),
            transparent
        );

    box-shadow:
        0 0 9px rgba(110,205,255,0.8);

    transform:
        skewX(-25deg);

    animation:
        wind-gust 1s linear forwards;

}


@keyframes wind-gust {

    0% {

        transform:
            translateX(-200px)
            skewX(-25deg);

        opacity:
            0;

    }

    12% {

        opacity:
            1;

    }

    100% {

        transform:
            translateX(120vw)
            skewX(-25deg);

        opacity:
            0;

    }

}


/* ============================================================
   021 — DEBRIS
   ============================================================ */

.wind-debris {

    position:
        absolute;

    left:
        -80px;

    font-size:
        19px;

    animation:
        debris-fly 1.45s cubic-bezier(.2,.8,.2,1) forwards;

}


@keyframes debris-fly {

    0% {

        transform:
            translateX(-100px)
            rotate(0deg);

        opacity:
            0;

    }

    15% {

        opacity:
            1;

    }

    100% {

        transform:
            translate(
                115vw,
                var(--debris-y)
            )
            rotate(720deg);

        opacity:
            0;

    }

}


/* ============================================================
   022 — SCREEN SHAKE
   ============================================================ */

.screen-shake {

    animation:
        screen-shake 700ms ease;

}


@keyframes screen-shake {

    0%, 100% {

        transform:
            translate(0,0);

    }

    15% {

        transform:
            translate(-7px,4px);

    }

    30% {

        transform:
            translate(7px,-5px);

    }

    45% {

        transform:
            translate(-6px,-3px);

    }

    60% {

        transform:
            translate(5px,4px);

    }

    75% {

        transform:
            translate(-3px,-2px);

    }

}


/* ============================================================
   023 — FLOOD
   ============================================================ */

.flood-layer {

    position:
        absolute;

    left:
        0;

    right:
        0;

    bottom:
        0;

    height:
        0;

    overflow:
        visible;

    background:
        linear-gradient(
            to bottom,
            rgba(76,188,255,0.68),
            rgba(7,67,150,0.97)
        );

    border-top:
        3px solid rgba(204,244,255,0.8);

    box-shadow:
        0 -12px 35px rgba(54,169,255,0.25);

    transition:
        height 2.8s cubic-bezier(.2,.8,.2,1);

}


.flood-wave {

    position:
        absolute;

    left:
        -10%;

    top:
        -12px;

    width:
        120%;

    height:
        24px;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 20px,
            rgba(255,255,255,0.25) 20px 45px,
            transparent 45px 75px
        );

    animation:
        flood-wave 900ms linear infinite;

}


@keyframes flood-wave {

    to {

        transform:
            translateX(-75px);

    }

}


/* ============================================================
   024 — RAIN
   ============================================================ */

.rain-drop {

    position:
        absolute;

    top:
        -45px;

    width:
        2px;

    height:
        30px;

    background:
        rgba(195,228,255,0.75);

    animation:
        rain-drop 800ms linear forwards;

}


@keyframes rain-drop {

    to {

        transform:
            translateY(120vh)
            rotate(13deg);

        opacity:
            0;

    }

}


/* ============================================================
   025 — HAIL
   ============================================================ */

.hailstone {

    position:
        absolute;

    top:
        -50px;

    border-radius:
        50%;

    background:
        #ffffff;

    box-shadow:
        0 0 9px rgba(255,255,255,0.85);

    animation:
        hail-fall 900ms linear forwards;

}


@keyframes hail-fall {

    to {

        transform:
            translateY(120vh)
            rotate(450deg);

        opacity:
            0.15;

    }

}


/* ============================================================
   026 — TORNADO
   ============================================================ */

.tornado {

    position:
        absolute;

    left:
        -300px;

    bottom:
        4%;

    width:
        210px;

    height:
        400px;

    filter:
        drop-shadow(
            0 0 25px
            rgba(150,160,185,0.22)
        );

    animation:
        tornado-cross 3.4s linear forwards;

}


.tornado.large {

    width:
        280px;

    height:
        500px;

}


.tornado-funnel {

    position:
        absolute;

    inset:
        0;

    background:

        radial-gradient(
            ellipse at 50% 10%,
            rgba(244,247,255,0.28),
            transparent 34%
        ),

        radial-gradient(
            ellipse at 50% 43%,
            rgba(75,80,99,0.86),
            rgba(25,28,39,0.97) 58%,
            transparent 73%
        );

    clip-path:
        polygon(
            27% 0,
            73% 0,
            84% 18%,
            69% 44%,
            60% 67%,
            54% 100%,
            46% 100%,
            40% 67%,
            31% 44%,
            16% 18%
        );

    animation:
        tornado-wobble 420ms linear infinite alternate;

}


.tornado-dust {

    position:
        absolute;

    left:
        29%;

    bottom:
        -5px;

    width:
        42%;

    height:
        20px;

    border-radius:
        50%;

    background:
        rgba(185,180,155,0.35);

    filter:
        blur(7px);

}


@keyframes tornado-wobble {

    from {

    button.type =

    button.className =
        "event-button";


    button.innerHTML = `

        <span class="event-code">
            ${eventData.code}
        </span>

        <span class="event-description">
            ${eventData.name}
        </span>

        <span class="event-points">
            +${eventData.points} points
        </span>

    `;


    button.addEventListener(
        "click",
        () => {

            triggerEvent(
                eventData,
                button
            );

        }
    );


    return button;

}


/* ============================================================
   039 — TRIGGER EVENT
   ============================================================ */

function triggerEvent(
    eventData,
    sourceButton
) {

    STATE.score +=
        eventData.points;

    STATE.events +=
        1;


    STATE.history.unshift({

        code:
            eventData.code,

        name:
            eventData.name,

        points:
            eventData.points,

        time:
            new Date()

    });


    updateInterface();

    addHistoryEntry(
        eventData
    );


    runEventEffect(
        eventData,
        sourceButton
    );


    if (
        eventData.danger ===
        true
    ) {

        showCriticalAlert(
            eventData
        );

    }


    checkAchievements();

}

   040 — INTERFACE UPDATE
   ============================================================ */

    DOM.score.textContent =
        STATE.score.toLocaleString();

    DOM.eventCount.textContent =
        `${STATE.events} events`;

    DOM.historyCount.textContent =
        STATE.history.length;

    DOM.achievementPill.textContent =
        `${Math.min(STATE.events,100)} / 100`;

}

   041 — HISTORY
   ============================================================ */

function addHistoryEntry(
    eventData
) {

    const empty =
        DOM.history.querySelector(
            ".history-empty"
        );


    if (empty) {

        DOM.history.innerHTML =
            "";

    }


    const row =
        document.createElement(
            "div"
        );

    row.className =
        "history-row";


    row.innerHTML = `

        <span>
            <b>${eventData.code}</b>
            —
            ${eventData.name}
        </span>

        <span class="history-points">
            +${eventData.points}
        </span>

    `;


    DOM.history.prepend(
        row
    );

}

            ⚠️ CRITICAL EVENT
        </span>

        <span class="critical-alert-sub">
            ${eventData.name.toUpperCase()}
        </span>

    `;


    DOM.effectLayer.appendChild(
        alert

    document.body.classList.add(
        "critical-pulse"
    );


    setTimeout(
        () => {

            document.body.classList.remove(
                "critical-pulse"
            );

        },
        650
    );


    setTimeout(
        () => {

            alert.remove();

        },
        2800
    );

}


/* ============================================================
   043 — ACHIEVEMENTS
   ============================================================ */

function checkAchievements() {

    ACHIEVEMENTS.forEach(
        achievement => {

            if (
                STATE.events >=
                achievement.amount
            ) {

                if (
                    !STATE.achievements.has(
                        achievement.amount
                    )
                ) {

                    STATE.achievements.add(
                        achievement.amount
                    );

                    showAchievement(
                        achievement
                    );

                }

            }

        }
    );

}

            ${achievement.description}

        () => {

    ) {

        case "tornado":

            createTornado(
                eventData,
                false
            );

            break;


        case "tornado-house":

            createTornado(
                eventData,
                true
            );

            break;


        case "wind":

            createWind(
                18
            );

            break;


        case "eww":

            createExtremeWind();

            break;


        case "flood":

            createFlood(
                eventData.floodLevel
            );

            break;


        case "hurricane":

            createHurricane();

            break;


        case "nuke":

            createNuke();

            break;


        case "warning":

            showToast(
                "⚠️ Simulation warning triggered."
            );

            break;


        case "pink":

            createPinkPurpleAlert();

            break;


        case "power-out":

            createPowerOutage();

            break;


        case "power-restore":

            restorePower();

            break;


        case "hail":

            createHail(
                eventData.size
            );

            break;

    }

}


/* ============================================================
   046 — TORNADO
   ============================================================ */

function createTornado(
    eventData,
    hitsHouse
) {

    const tornado =
        document.createElement(
            "div"
        );

    tornado.className =
        "tornado";


    if (
        eventData.points >=
        3
    ) {

        tornado.classList.add(
            "large"
        );

    }


    const funnel =
        document.createElement(
            "div"
        );

    funnel.className =
        "tornado-funnel";


    const dust =
        document.createElement(
            "div"
        );

    dust.className =
        "tornado-dust";


    tornado.appendChild(
        funnel
    );

    tornado.appendChild(
        dust
    );


    DOM.effectLayer.appendChild(
        tornado
    );


    createWind(
        eventData.points >= 7
            ? 28
            : 14
    );


    if (
        hitsHouse
    ) {

        showToast(
            "🏠 SIMULATION: structure impact"
        );

    }


    if (
        eventData.points >= 7
    ) {

        createButtonChaos(
            eventData.points
        );

    }


    setTimeout(
        () => {

            tornado.remove();

        },
        3500
    );

}


/* ============================================================
   047 — BUTTON CHAOS
   ============================================================ */

function createButtonChaos(
    amount
) {

    const buttons =
        Array.from(
            document.querySelectorAll(
                ".event-button"
            )
        );


    const shuffled =
        buttons.sort(
            () =>
                Math.random() - 0.5
        );


    const amountToMove =
        Math.min(
            amount,
            shuffled.length
        );


    for (
        let i = 0;
        i < amountToMove;
        i++
    ) {

        const button =
            shuffled[i];


        const x =
            Math.round(
                (Math.random() * 260) - 130
            );

        const y =
            Math.round(
                (Math.random() * -180) - 40
            );


        button.style.setProperty(
            "--fly-x",
            `${x}px`
        );


        button.style.setProperty(
            "--fly-y",
            `${y}px`
        );


        button.classList.add(
            "flying-button"
        );


        setTimeout(
            () => {

                button.classList.remove(
                    "flying-button"
                );

            },
            1900
        );

    }

}


/* ============================================================
   048 — WIND
   ============================================================ */

function createWind(
    amount = 15
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const gust =
            document.createElement(
                "div"
            );


        gust.className =
            "wind-gust";


        gust.style.top =
            `${Math.random() * 100}%`;


        gust.style.width =
            `${60 + Math.random() * 190}px`;


        gust.style.animationDelay =
            `${Math.random() * 0.45}s`;


        DOM.effectLayer.appendChild(
            gust
        );


        setTimeout(
            () => {

                gust.remove();

            },
            1700
        );

    }

}


/* ============================================================
   049 — EXTREME WIND
   ============================================================ */

function createExtremeWind() {

    createWind(
        38
    );


    const debrisTypes = [

        "🍃",
        "🌿",
        "📄",
        "🪵",
        "🍂"

    ];


    for (
        let i = 0;
        i < 15;
        i++
    ) {

        const debris =
            document.createElement(
                "div"
            );


        debris.className =
            "wind-debris";


        debris.textContent =
            debrisTypes[
                Math.floor(
                    Math.random() *
                    debrisTypes.length
                )
            ];


        debris.style.top =
            `${Math.random() * 92}%`;


        debris.style.setProperty(
            "--debris-y",
            `${Math.random() * 200 - 100}px`
        );


        debris.style.animationDelay =
            `${Math.random() * 0.5}s`;


        DOM.effectLayer.appendChild(
            debris
        );


        setTimeout(
            () => {

                debris.remove();

            },
            2200
        );

    }


    document.body.classList.add(
        "screen-shake"
    );


    setTimeout(
        () => {

            document.body.classList.remove(
                "screen-shake"
            );

        },
        800
    );

}


/* ============================================================
   050 — FLOOD
   ============================================================ */

function createFlood(
    targetHeight
) {

    const flood =
        document.createElement(
            "div"
        );

    flood.className =
        "flood-layer";


    const wave =
        document.createElement(
            "div"
        );

    wave.className =
        "flood-wave";


    flood.appendChild(
        wave
    );


    DOM.effectLayer.appendChild(
        flood
    );


    requestAnimationFrame(
        () => {

            flood.style.height =
                `${targetHeight}%`;

        }
    );


    createRain(
        targetHeight >= 45
            ? 50
            : 28
    );


    setTimeout(
        () => {

            flood.style.height =
                "0%";


            setTimeout(
                () => {

                    flood.remove();

                },
                3100
            );

        },
        4300
    );

}


/* ============================================================
   051 — RAIN
   ============================================================ */

function createRain(
    amount
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const drop =

                "div"
            );

        drop.style.left =
            `${Math.random() * 100}%`;


        drop.style.animationDelay =
            `${Math.random() * 0.8}s`;


        DOM.effectLayer.appendChild(
            drop
        );


        setTimeout(
            () => {

                drop.remove();

            },
            1900
        );

    }

}


/* ============================================================
   052 — HURRICANE
   ============================================================ */

function createHurricane() {

    const hurricane =
        document.createElement(
            "div"
        );

    hurricane.className =
        "hurricane";


    const eye =
        document.createElement(
            "div"
        );

    eye.className =
        "hurricane-eye";

    );

        hurricane
    );


    createRain(
        65
    );


    setTimeout(
        () => {

            hurricane.remove();

        },
        4400
    );

}


/* ============================================================
   053 — HAIL
   ============================================================ */

function createHail(
    size
) {

    const amount =
        Math.min(
            50,
            12 + size * 4
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const hail =
            document.createElement(
                "div"
            );


        hail.className =
            "hailstone";


        const pixelSize =
            4 + size * 2.4;


        hail.style.width =
            `${pixelSize}px`;


        hail.style.height =
            `${pixelSize}px`;


        hail.style.left =
            `${Math.random() * 100}%`;


        hail.style.animationDelay =
            `${Math.random() * 0.55}s`;


        DOM.effectLayer.appendChild(
            hail
        );


        setTimeout(
            () => {

                hail.remove();

            },
            1900
        );

    }

}


/* ============================================================
   054 — NUKE SIMULATION
   ============================================================ */

function createNuke() {

    const object =
        document.createElement(
            "div"
        );

    object.className =
        "nuke-object";

    object.textContent =
        "☢️";


    DOM.effectLayer.appendChild(

    );

}


/* ============================================================
   055 — NUKE EXPLOSION
   ============================================================ */

function createNukeExplosion() {

    explosion.className =
        "nuke-explosion";

    );

            document.body.classList.remove(

            );

    );

    );

/* ============================================================
   056 — PINK / PURPLE
   ============================================================ */

function createPinkPurpleAlert() {

    const alert =
        document.createElement(
            "div"
        );


    alert.className =
        "critical-alert pink-purple-alert";


    alert.innerHTML = `

        <span class="critical-alert-title">
            💗💜 CHAOS ALERT 💜💗
        </span>

        <span class="critical-alert-sub">
            FICTIONAL PINK / PURPLE SIMULATION EVENT
        </span>

    `;


    DOM.effectLayer.appendChild(
        alert
    );


    setTimeout(
        () => {

            alert.remove();

        },
        3100
    );

}


/* ============================================================
   057 — POWER OUTAGE
   ============================================================ */

function createPowerOutage() {

    if (
        STATE.powerOut
    ) {

        showToast(
            "⚡ POWER IS ALREADY OUT"
        );

        return;

    }


    STATE.powerOut =
        true;


    document.body.classList.add(
        "power-flicker"
    );


    setTimeout(
        () => {

            document.body.classList.remove(
                "power-flicker"
            );

            document.body.classList.add(
                "power-out"
            );

        },
        650
    );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "power-message";


    message.textContent =
        "⚡ POWER OUTAGE — SIMULATION";


    DOM.effectLayer.appendChild(
        message
    );


    setTimeout(
        () => {

            message.remove();

        },
        2300
    );

}


/* ============================================================
   058 — RESTORE POWER
   ============================================================ */

function restorePower() {

    STATE.powerOut =
        false;


    document.body.classList.remove(
        "power-out"
    );


    document.body.classList.remove(
        "power-flicker"
    );


    showToast(
        "🔌 POWER RESTORED"
    );

}


/* ============================================================
   059 — TOAST
   ============================================================ */

let toastTimer =
    null;


function showToast(
    message
) {

    DOM.toast.textContent =
        message;


    DOM.toast.classList.add(
        "visible"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                DOM.toast.classList.remove(
                    "visible"
                );

            },
            2200
        );

}


/* ============================================================
   060 — RESET SCORE
   ============================================================ */

DOM.resetScore.addEventListener(
    "click",
    () => {

        STATE.score =
            0;

        updateInterface();

        showToast(
            "🔄 SCORE RESET"
        );

    }
);


/* ============================================================
   061 — CLEAR HISTORY
   ============================================================ */

DOM.clearHistory.addEventListener(
    "click",
    () => {

        STATE.history =
            [];

        STATE.events =
            0;

        STATE.achievements.clear();

        DOM.history.innerHTML = `

            <div class="history-empty">
                No events yet.
            </div>

        `;

        updateInterface();

        showToast(
            "🗑️ HISTORY CLEARED"
        );

    }
);


/* ============================================================
   062 — RESTORE POWER BUTTON
   ============================================================ */

DOM.restorePower.addEventListener(
    "click",
    () => {

        restorePower();

    }
);


/* ============================================================
   063 — FULL RESET
   ============================================================ */

DOM.resetEverything.addEventListener(
    "click",
    () => {

        STATE.score =
            0;

        STATE.events =
            0;

        STATE.powerOut =
            false;

        STATE.history =
            [];

        STATE.achievements.clear();


        DOM.history.innerHTML = `

            <div class="history-empty">
                No events yet.
            </div>

        `;


        DOM.effectLayer.innerHTML =
            "";


        document.body.classList.remove(
            "power-out",
            "power-flicker",
            "screen-shake",
            "critical-pulse"
        );


        updateInterface();


        showToast(
            "💥 DAMAGE PROGRAM RESET"
        );

    }
);

buildCategories();

updateInterface();

console.log(

);

);

);

</script>
