<style>

/* ============================================================
   DAMAGE PROGRAM™
   FACTORY RESET
   PART 1 — FOUNDATION
   ============================================================ */

:root {
    --bg: #060812;
    --panel: #101625;
    --panel-2: #151c2e;
    --border: rgba(255,255,255,0.10);

    --text: #f5f7ff;
    --muted: #8995b0;

    --cyan: #54ddff;
    --blue: #4389ff;
    --purple: #a66cff;
    --pink: #ff5fd5;
    --red: #ff405b;
    --orange: #ff9c42;
    --yellow: #ffd65a;
    --green: #50e49a;

    --radius: 20px;
}

/* ============================================================
   RESET
   ============================================================ */

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: var(--bg);
}

body {
    margin: 0;
    min-height: 100vh;

    color: var(--text);
    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(84,221,255,0.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 0%,
            rgba(255,95,213,0.08),
            transparent 30%
        ),
        var(--bg);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}

/* ============================================================
   APP
   ============================================================ */

#app {
    width: min(1200px, 100%);
    min-height: 100vh;

    margin: 0 auto;
    padding: 18px;
}

/* ============================================================
   GLASS PANELS
   ============================================================ */

.panel {
    background: rgba(16,22,37,0.88);

    border: 1px solid var(--border);
    border-radius: var(--radius);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.35);

    backdrop-filter: blur(18px);
}

/* ============================================================
   HEADER
   ============================================================ */

header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 20px;

    padding: 18px;
}

.brand {
    display: flex;
    align-items: center;

    gap: 14px;
}

.logo {
    width: 56px;
    height: 56px;

    display: grid;
    place-items: center;

    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            #17253f,
            #21142f
        );

    border: 1px solid var(--border);

    font-size: 28px;
}

.title {
    margin: 0;

    font-size: clamp(24px, 6vw, 40px);
    font-weight: 950;

    letter-spacing: -0.05em;
}

.subtitle {
    margin-top: 6px;

    color: var(--muted);

    font-size: 10px;
    font-weight: 800;

    letter-spacing: 0.16em;
}

.status {
    display: flex;
    align-items: center;

    gap: 8px;

    color: var(--muted);

    font-size: 11px;
    font-weight: 800;

    white-space: nowrap;
}

.status-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 16px rgba(80,228,154,0.9);
}

/* ============================================================
   MAIN GRID
   ============================================================ */

.main-grid {
    display: grid;

    grid-template-columns:
        minmax(0, 1.2fr)
        minmax(300px, 0.8fr);

    gap: 16px;

    margin-top: 16px;
}

/* ============================================================
   CARDS
   ============================================================ */

.card {
    padding: 18px;
}

.card + .card {
    margin-top: 16px;
}

/* ============================================================
   SCORE
   ============================================================ */

.score-card {
    text-align: center;

    padding: 30px 18px;
}

.score-label {
    color: var(--muted);

    font-size: 10px;
    font-weight: 900;

    letter-spacing: 0.22em;
}

.score {
    margin: 10px 0;

    font-size: clamp(60px, 13vw, 110px);
    font-weight: 950;

    line-height: 0.9;

    letter-spacing: -0.07em;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--pink),
            var(--purple)
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.score-meta {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;
}

.pill {
    padding: 7px 12px;

    border: 1px solid var(--border);
    border-radius: 999px;

    color: var(--muted);

    background: rgba(255,255,255,0.03);

    font-size: 10px;
    font-weight: 800;
}

/* ============================================================
   SECTION TITLE
   ============================================================ */

.section-title {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin-bottom: 12px;
}

.section-title h2 {
    margin: 0;

    font-size: 17px;
    font-weight: 900;
}

.section-title span {
    color: var(--muted);

    font-size: 10px;
    font-weight: 700;
}

/* ============================================================
   EVENT CENTER
   ============================================================ */

.categories {
    display: grid;

    gap: 10px;
}

.category {
    overflow: hidden;

    border:
        1px solid var(--border);

    border-radius: 17px;

    background:
        rgba(5,8,17,0.55);
}

.category-header {
    width: 100%;

    min-height: 66px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 13px;

    color: var(--text);

    background: transparent;

    text-align: left;

    cursor: pointer;
}

.category-header:hover {
    background:
        rgba(255,255,255,0.04);
}

.category-left {
    display: flex;

    align-items: center;

    gap: 12px;
}

.category-icon {
    width: 40px;
    height: 40px;

    display: grid;
    place-items: center;

    border-radius: 12px;

    background:
        rgba(255,255,255,0.05);

    font-size: 22px;
}

.category-name {
    font-size: 14px;
    font-weight: 900;
}

.category-description {
    margin-top: 3px;

    color: var(--muted);

    font-size: 10px;
}

.category-arrow {
    color: var(--muted);

    font-size: 18px;
}

/* ============================================================
   EVENT LIST
   ============================================================ */

.event-list {
    display: none;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 9px;

    padding: 0 10px 10px;
}

.category.open .event-list {
    display: grid;
}

.event-button {
    min-height: 78px;

    padding: 12px;

    border:
        1px solid var(--border);

    border-radius: 14px;

    color: var(--text);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.06),
            rgba(255,255,255,0.02)
        );

    text-align: left;

    cursor: pointer;
}

.event-button:hover {
    border-color:
        rgba(255,255,255,0.22);

    background:
        rgba(255,255,255,0.08);
}

.event-code {
    display: block;

    font-size: 14px;
    font-weight: 950;
}

.event-description {
    display: block;

    margin-top: 4px;

    color: var(--muted);

    font-size: 10px;
}

.event-points {
    display: block;

    margin-top: 7px;

    color: var(--yellow);

    font-size: 10px;
    font-weight: 900;
}

/* ============================================================
   HISTORY
   ============================================================ */

.history {
    max-height: 450px;

    overflow-y: auto;
}

.history-empty {
    padding: 40px 10px;

    color: var(--muted);

    text-align: center;

    font-size: 12px;
}

.history-row {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin-bottom: 7px;

    padding: 11px;

    border:
        1px solid var(--border);

    border-radius: 13px;

    background:
        rgba(255,255,255,0.03);
}

.history-code {
    font-weight: 950;
}

.history-name {
    color: var(--muted);

    font-size: 10px;
}

.history-points {
    color: var(--yellow);

    font-weight: 950;
}

/* ============================================================
   CONTROLS
   ============================================================ */

.controls {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 9px;
}

.control-button {
    min-height: 50px;

    border:
        1px solid var(--border);

    border-radius: 14px;

    color: var(--text);

    background:
        var(--panel-2);

    cursor: pointer;
}

.control-button:hover {
    background:
        #1b2439;
}

.danger {
    border-color:
        rgba(255,64,91,0.25);

    background:
        rgba(70,20,32,0.8);
}

/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 900px) {

    .main-grid {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 600px) {

    #app {
        padding: 10px;
    }

    header {
        padding: 14px;
    }

    .logo {
        width: 47px;
        height: 47px;

        font-size: 23px;
    }

    .title {
        font-size: 22px;
    }

    .subtitle {
        font-size: 8px;
    }

    .status {
        display: none;
    }

}

@media (max-width: 540px) {

    .event-list {
        grid-template-columns: 1fr;
    }

}

/* ============================================================
   DAMAGE PROGRAM™
   FACTORY RESET
   PART 1 — APPLICATION FOUNDATION
   ============================================================ */


/* ============================================================
   STATE
   ============================================================ */

const STATE = {

    score: 0,

    events: 0,

    history: [],

    powerOut: false

};


/* ============================================================
   APPLICATION
   ============================================================ */

const APP = {

    storageKey:
        "damage-program-factory-reset"

};


/* ============================================================
   DOM
   ============================================================ */

const DOM = {

    score:
        document.getElementById("score"),

    eventCount:
        document.getElementById("event-count"),

    categories:
        document.getElementById("categories"),

    history:
        document.getElementById("history"),

    historyCount:
        document.getElementById("history-count"),

    resetScore:
        document.getElementById("reset-score"),

    clearHistory:
        document.getElementById("clear-history"),

    restorePower:
        document.getElementById("restore-power"),

    resetEverything:
        document.getElementById("reset-everything")

};


/* ============================================================
   BASIC UPDATE FUNCTIONS
   ============================================================ */

function updateScore() {

    DOM.score.textContent =
        STATE.score.toLocaleString();

}


function updateEventCount() {

    DOM.eventCount.textContent =
        `${STATE.events} events`;

}


function updateHistoryCount() {

    DOM.historyCount.textContent =
        STATE.history.length;

}


function updateInterface() {

    updateScore();

    updateEventCount();

    updateHistoryCount();

}


/* ============================================================
   HISTORY
   ============================================================ */

function renderHistory() {

    if (
        STATE.history.length === 0
    ) {

        DOM.history.innerHTML = `
            <div class="history-empty">
                No events yet.
            </div>
        `;

        return;

    }


    DOM.history.innerHTML =
        STATE.history
            .map(event => {

                return `
                    <div class="history-row">

                        <div>

                            <div class="history-code">
                                ${event.code}
                            </div>

                            <div class="history-name">
                                ${event.name}
                            </div>

                        </div>

                        <div class="history-points">
                            +${event.points}
                        </div>

                    </div>
                `;

            })
            .join("");

}


/* ============================================================
   SAVE
   ============================================================ */

function saveState() {

    localStorage.setItem(
        APP.storageKey,
        JSON.stringify(STATE)
    );

}


/* ============================================================
   LOAD
   ============================================================ */

function loadState() {

    try {

        const saved =
            localStorage.getItem(
                APP.storageKey
            );

        if (!saved) {
            return;
        }

        const data =
            JSON.parse(saved);

        if (
            typeof data.score ===
            "number"
        ) {

            STATE.score =
                data.score;

        }

        if (
            typeof data.events ===
            "number"
        ) {

            STATE.events =
                data.events;

        }

        if (
            Array.isArray(data.history)
        ) {

            STATE.history =
                data.history;

        }

        if (
            typeof data.powerOut ===
            "boolean"
        ) {

            STATE.powerOut =
                data.powerOut;

        }

    }

    catch (error) {

        console.warn(
            "Could not load saved state.",
            error
        );

    }

}


/* ============================================================
   CONTROLS
   ============================================================ */

function resetScore() {

    STATE.score = 0;

    updateInterface();

    saveState();

}


function clearHistory() {

    STATE.history = [];

    STATE.events = 0;

    renderHistory();

    updateInterface();

    saveState();

}


function restorePower() {

    STATE.powerOut = false;

    saveState();

}


function resetEverything() {

    STATE.score = 0;

    STATE.events = 0;

    STATE.history = [];

    STATE.powerOut = false;

    renderHistory();

    updateInterface();

    saveState();

}


/* ============================================================
   BUTTONS
   ============================================================ */

DOM.resetScore.addEventListener(
    "click",
    resetScore
);


DOM.clearHistory.addEventListener(
    "click",
    clearHistory
);


DOM.restorePower.addEventListener(
    "click",
    restorePower
);


DOM.resetEverything.addEventListener(
    "click",
    resetEverything
);


/* ============================================================
   STARTUP
   ============================================================ */

loadState();

renderHistory();

updateInterface();

/* ============================================================
   RENDER EVENT BUTTON
   ============================================================ */

function createEventButton(event) {

    const button =
        document.createElement("button");

    button.type =
        "button";

    button.className =
        "event-button";


    button.innerHTML = `

        <span class="event-code">
            ${event.code}
        </span>

        <span class="event-description">
            ${event.name}
        </span>

        <span class="event-points">
            +${event.points}
        </span>

    `;


    button.addEventListener(
        "click",
        () => {

            triggerEvent(event.code);

        }
    );


    return button;

}


/* ============================================================
   RENDER CATEGORY
   ============================================================ */

function createCategory(
    categoryKey,
    category
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "category";


    const header =
        document.createElement("button");

    header.type =
        "button";

    header.className =
        "category-header";


    header.innerHTML = `

        <span class="category-left">

            <span class="category-icon">
                ${category.icon}
            </span>

            <span>

                <span class="category-name">
                    ${category.name}
                </span>

                <span class="category-description">
                    ${category.description}
                </span>

            </span>

        </span>

        <span class="category-arrow">
            ▼
        </span>

    `;


    const eventList =
        document.createElement("div");

    eventList.className =
        "event-list";


    category.events.forEach(
        eventCode => {

            const event =
                EVENTS[eventCode];

            if (!event) {
                return;
            }

            eventList.appendChild(
                createEventButton(event)
            );

        }
    );


    header.addEventListener(
        "click",
        () => {

            wrapper.classList.toggle(
                "open"
            );

        }
    );


    wrapper.appendChild(header);

    wrapper.appendChild(eventList);


    return wrapper;

}


/* ============================================================
   RENDER ALL CATEGORIES
   ============================================================ */

function renderCategories() {

    DOM.categories.innerHTML =
        "";


    Object.entries(
        EVENT_CATEGORIES
    ).forEach(
        (
            [
                categoryKey,
                category
            ]
        ) => {

            DOM.categories.appendChild(
                createCategory(
                    categoryKey,
                    category
                )
            );

        }
    );

}


/* ============================================================
   EVENT TRIGGER
   ============================================================ */

function triggerEvent(
    eventCode
) {

    const event =
        EVENTS[eventCode];


    if (!event) {

        console.error(
            "Unknown event:",
            eventCode
        );

        return;

    }


    STATE.score +=
        event.points;


    STATE.events +=
        1;


    STATE.history.unshift({

        code:
            event.code,

        name:
            event.name,

        points:
            event.points,

        time:
            Date.now()

    });


    renderHistory();

    updateInterface();

    saveState();


    console.log(
        `EVENT: ${event.code} +${event.points}`
    );

}

/* ============================================================
   EVENT DATABASE VERIFICATION
   ============================================================ */

function verifyEventDatabase() {

    const requiredEvents = [

        "NADO",
        "PDS",
        "DSTW",
        "TE",

        "FW",
        "SFW",
        "FLD",
        "FE",

        "EWW",
        "PO",
        "PR",

        "NW",
        "NUKE",
        "N10",

        "NADO-H",
        "TE-H",

        "RED",
        "PINK"

    ];


    const missing =
        requiredEvents.filter(
            code => !EVENTS[code]
        );


    if (missing.length > 0) {

        console.error(
            "EVENT DATABASE ERROR:",
            missing
        );

        return false;

    }


    console.log(
        "EVENT DATABASE VERIFIED:",
        requiredEvents.length,
        "events"
    );


    return true;

}
